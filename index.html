<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saint George &amp; the Dragon</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1b1530;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:Verdana,Arial,sans-serif}
  /* nozoom v14: iPhone Safari zoomed in on fast taps of the touch buttons and stayed stuck; lock the page so it can never scale or scroll */
  body{position:fixed;inset:0;width:100%}
  canvas,#touch,#dpad,#knob,.tbtn{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  body.touch #wrap{align-items:flex-start;padding-top:env(safe-area-inset-top)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
    box-shadow:0 0 30px rgba(0,0,0,.6);border-radius:6px}
  #touch{display:none}
  body.touch #touch{display:block}
  #dpad{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);touch-action:none}
  #dpad:before,#dpad:after{content:"";position:absolute;background:rgba(255,255,255,.35);border-radius:6px}
  #dpad:before{left:62px;top:14px;width:26px;height:122px}
  #dpad:after{top:62px;left:14px;height:26px;width:122px}
  #knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6);z-index:2;pointer-events:none}
  .tbtn{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.6);color:#fff;font-weight:bold;
    display:flex;align-items:center;justify-content:center;touch-action:none;text-shadow:0 2px 2px rgba(0,0,0,.5)}
  #btnA{right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:86px;height:86px;background:rgba(220,50,60,.75);font-size:30px}
  #btnS{right:124px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;background:rgba(200,200,215,.75);font-size:26px}
  #btnSp{right:30px;bottom:calc(140px + env(safe-area-inset-bottom));width:66px;height:66px;background:rgba(240,190,40,.85);font-size:15px;display:none}
  body.touch.spear #btnSp{display:flex}
  #btnM{right:14px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;background:rgba(120,60,170,.7);font-size:20px}
  #btnM.off{opacity:.45}
  #btnH{right:118px;bottom:calc(173px + env(safe-area-inset-bottom));width:54px;height:54px;background:rgba(235,235,250,.8);font-size:26px}   /* mobile v13: next to A in the action cluster */
  #btnQ{right:66px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;background:rgba(60,120,220,.75);font-size:20px}
  #btnT{right:34px;bottom:calc(216px + env(safe-area-inset-bottom));width:54px;height:54px;background:rgba(150,110,70,.85);font-size:24px;display:none}   /* toolshop v16: TOOL button, only once a tool is owned */
  body.touch.tools #btnT{display:flex}
  #btnD{right:124px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;background:rgba(60,170,110,.8);font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="tbtn" id="btnA">A</div>
  <div class="tbtn" id="btnQ">&#9776;</div>
  <div class="tbtn" id="btnS">&#128737;</div>
  <div class="tbtn" id="btnSp">SPEAR</div>
  <div class="tbtn" id="btnD">DASH</div>
  <div class="tbtn" id="btnM">&#9834;</div>
  <div class="tbtn" id="btnH">&#x1F434;</div>
  <div class="tbtn" id="btnT">&#x1FA93;</div>
</div>
<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TS = 32, W = 640, H = 480;
// bigworld v12: the overworld grew from 72x52 to 100x72 tiles (~1.9x the land). The old 72x52 core keeps its exact
// layout and coordinates (OW/OH); the new lands lie east (x>=72) and south (y>=52) of it.
const OW = 72, OH = 52, MW = 100, MH = 72;
const T = {GRASS:0,TREE:1,WATER:2,BRIDGE:3,PATH:4,WALL:5,FLOOR:6,HOUSE:7,FLOWER:8,ROCK:9,SAND:10,CAVE:11,
  CARPET:12,FOUNTAIN:13,MOUNTAIN:14,HILL:15,CFLOOR:16,CWALL:17,EXIT:18,LAIRDOOR:19};
const SOLID = new Set([T.TREE,T.WATER,T.WALL,T.HOUSE,T.ROCK,T.FOUNTAIN,T.MOUNTAIN,T.CWALL]);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const tc = t => t*TS+TS/2; // tile center

// ================== INPUT ==================
const keys = {}; let pv = {}; // pv = virtual buttons pressed this frame
const touchDir = {x:0,y:0}; let touchBlock=false, padBlock=false;
function blockHeld(){ return !!(keys['shift']||keys['x']||padBlock||touchBlock); }
const KEYMAP = {' ':'action','e':'action','enter':'action','z':'action','q':'pause','tab':'pause','p':'pause','escape':'pause','r':'restart','m':'mute','n':'music','v':'voices','f':'spear','c':'dash','control':'dash','h':'horse','t':'autotext','g':'tool'};   // toolshop v16: G = use tool, 1-4 = pick a tool
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k] && KEYMAP[k]) pv[KEYMAP[k]] = true;
  if (!keys[k] && k>='1' && k<='4') pv.toolSel = +k;
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright','tab','control'].includes(k)) e.preventDefault();
  initAudio(); voiceKick();
  if(KEYMAP[k]==='action' && typeof G!=='undefined' && G && G.mode==='pause' && G.pause && PAUSE_ITEMS[G.pause.sel]==='test') voiceTest(); // mobile v11: speak inside the key gesture
});
// mobile v11: iOS Safari / Android Chrome only unlock speech + audio inside a real gesture (touchend / click / keydown), never in rAF
{ const gest=()=>{ initAudio(); voiceKick(); };
  addEventListener('touchend',gest,{capture:true,passive:true}); addEventListener('click',gest,true); addEventListener('mouseup',gest,true); }
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchBlock=false; });
function inputDir(){
  let x=0,y=0;
  if (keys['arrowleft']||keys['a']) x-=1;
  if (keys['arrowright']||keys['d']) x+=1;
  if (keys['arrowup']||keys['w']) y-=1;
  if (keys['arrowdown']||keys['s']) y+=1;
  x+=touchDir.x+padDir.x; y+=touchDir.y+padDir.y;
  x=clamp(x,-1,1); y=clamp(y,-1,1);
  return {x,y};
}
// gamepad (Xbox / PlayStation via standard mapping)
const padDir={x:0,y:0}; let padPrev=[], padSeen=false; const toast={text:'',t:0};
function showToast(s){toast.text=s;toast.t=2.6;}
// autotext v13: optional auto-continue for dialogue + prayers (default OFF, saved in localStorage). Choices/menus never auto-pick.
let autoText=false; try{ autoText=localStorage.getItem('sg_autotext')==='1'; }catch(e){}
function setAutoText(v){ autoText=!!v; try{ localStorage.setItem('sg_autotext',autoText?'1':'0'); }catch(e){} showToast('Auto-continue: '+(autoText?'ON':'OFF')+' (T)'); }
const AUTO_BASE=1.2, AUTO_PER=0.055;                                   // reading time for kids: 1.2 s + 55 ms per letter
function autoReadTime(s){ return AUTO_BASE+AUTO_PER*String(s||'').length; }
function autoSpeechMax(s,rate){ return 2.5+1.5*String(s||'').length/(14*(rate||0.85)); } // iOS: if onend never comes, give up waiting after this
function hasChoice(d,line){ return !!(d&&(d.choice||d.noAuto))||!!(line&&(line.choice||line.choices||line.opts)); }
addEventListener('gamepadconnected',()=>{if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}});
addEventListener('gamepaddisconnected',()=>{padSeen=false;padPrev=[];showToast('Controller disconnected');});
let padUpAt=0;
function pollGamepad(){
  padDir.x=0;padDir.y=0;
  let pads=[]; try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  let gp=null; for(const p of (pads||[])){ if(p&&p.connected!==false&&p.buttons&&p.buttons.length){gp=p;break;} }
  if(!gp){padPrev=[];padBlock=false;return;}
  if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}
  const btn=i=>{const b=gp.buttons[i];return !!(b&&(b.pressed||b.value>0.5));};
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0, dz=0.35;
  if(Math.abs(ax)>dz) padDir.x=Math.sign(ax);
  if(Math.abs(ay)>dz) padDir.y=Math.sign(ay);
  if(padDir.x&&padDir.y){ if(Math.abs(ax)>Math.abs(ay)*2.2) padDir.y=0; else if(Math.abs(ay)>Math.abs(ax)*2.2) padDir.x=0; }
  if(btn(12))padDir.y=-1; if(btn(13))padDir.y=1; if(btn(14))padDir.x=-1; if(btn(15))padDir.x=1;
  const now=[]; for(let i=0;i<17;i++) now[i]=btn(i);
  padBlock = now[2]||now[4]||now[5];                                       // X / Square or LB / RB = hold to block
  const edge=i=>now[i]&&!padPrev[i];
  const m=G&&G.mode;
  if(edge(0)){pv.action=true;initAudio();}                                 // A / Cross
  if(edge(2) && (m==='title'||m==='dialog'||m==='victory')){pv.action=true;initAudio();} // X / Square also skips text
  if(edge(1)){ if(m==='pause'||m==='menu') pv.back=true; else if(m==='dialog'||m==='title'||m==='victory') pv.action=true; else pv.spear=true; initAudio(); } // B / Circle = Holy Spear thrust (spear v10); closes pause
  if(edge(3)){ if(m==='dialog') pv.action=true; else pv.dash=true; initAudio(); } // Y / Triangle = dash (dash v10)
  if(edge(9)){ if(m==='title'||m==='victory'||m==='dialog') pv.action=true; else pv.pause=true; initAudio(); } // Start / Options = pause menu (pause v10)
  if(edge(8)) pv.pause=true;                                               // Back / Share also opens / closes the pause menu
  if(edge(7) && m==='play') pv.tool=true;                                 // toolshop v16: RT = use tool, LT = next tool
  if(edge(6) && m==='play') pv.toolNext=true;
  if(edge(10) && m==='play') pv.horse=true;                                // horse v11: L3 (left stick click) = mount / dismount
  if(edge(12)) padUpAt=performance.now();                                  // horse v11: a quick TAP of D-pad Up also toggles the horse (holding it still walks up)
  if(!now[12] && padPrev[12] && m==='play' && performance.now()-padUpAt<230) pv.horse=true;
  padPrev=now;
}
// touch
const isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if (isTouch) document.body.classList.add('touch');
(function setupTouch(){
  const dp = document.getElementById('dpad'), knob = document.getElementById('knob');
  let pid = null;
  function upd(e){
    const r = dp.getBoundingClientRect();
    let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
    const d = Math.hypot(dx,dy), max = 50;
    if (d>max){dx=dx/d*max;dy=dy/d*max;}
    knob.style.left = (50+dx)+'px'; knob.style.top = (50+dy)+'px';
    const dz = 14;
    touchDir.x = Math.abs(dx)>dz ? Math.sign(dx) : 0;
    touchDir.y = Math.abs(dy)>dz ? Math.sign(dy) : 0;
    if (Math.abs(dx) > Math.abs(dy)*2.2) touchDir.y = 0;
    if (Math.abs(dy) > Math.abs(dx)*2.2) touchDir.x = 0;
  }
  function end(){pid=null;touchDir.x=0;touchDir.y=0;knob.style.left='50px';knob.style.top='50px';}
  dp.addEventListener('pointerdown',e=>{pid=e.pointerId;dp.setPointerCapture(pid);upd(e);initAudio();e.preventDefault();});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  dp.addEventListener('pointerup',end); dp.addEventListener('pointercancel',end);
  function btn(id,name){const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{pv[name]=true;initAudio();b.style.filter='brightness(1.4)';e.preventDefault();});
    const off=()=>b.style.filter=''; b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off);}
  btn('btnA','action'); btn('btnQ','pause'); btn('btnSp','spear'); btn('btnM','music'); btn('btnD','dash'); btn('btnH','horse'); btn('btnT','tool');
  { const b=document.getElementById('btnS'); const on=e=>{touchBlock=true;initAudio();b.style.filter='brightness(1.4)';e.preventDefault();};
    const off=()=>{touchBlock=false;b.style.filter='';};
    b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); }
  const cvHit=(cx,cy)=>{ const r=cv.getBoundingClientRect(); return pauseHit((cx-r.left)*W/r.width,(cy-r.top)*H/r.height); };
  // mobile v11: 'Test voice' must speak from touchend / click (a real gesture on iOS), so the tap only selects it on pointerdown
  const testTap=(cx,cy)=>{ if(G.mode!=='pause'||!G.pause) return; const i=cvHit(cx,cy); if(i>=0&&PAUSE_ITEMS[i]==='test'){ G.pause.sel=i; G.pause.confirm=false; voiceTest(); } };
  cv.addEventListener('touchend',e=>{ const c=e.changedTouches&&e.changedTouches[0]; if(c) testTap(c.clientX,c.clientY); },{passive:true});
  cv.addEventListener('click',e=>testTap(e.clientX,e.clientY));
  cv.addEventListener('pointerdown',e=>{initAudio(); if(G.mode==='pause'){ const i=cvHit(e.clientX,e.clientY); if(i>=0&&PAUSE_ITEMS[i]==='test'){ G.pause.sel=i; G.pause.confirm=false; } else if(i>=0) pv.pauseTap=i+1; }
    else if(G.mode==='menu'){ const r=cv.getBoundingClientRect(), i=menuHit((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height); if(i>=0) pv.menuTap=i+1; }
    else if(G.mode==='title'||G.mode==='victory'||G.mode==='dialog'||G.mode==='prayer'||G.mode==='storm'||G.mode==='night') pv.action=true;
    else if(G.mode==='play'){ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height; if(x>=W-290&&x<=W-250&&y>=6&&y<=40) pv.toolNext=true; } });
})();
// nozoom v14: stop iOS Safari double-tap zoom / pinch zoom on the buttons and canvas, and snap back to scale 1 if it ever happens
(function(){
  const stop=e=>{ if(e.cancelable) e.preventDefault(); };
  const onGame=t=>!!(t && t.closest && t.closest('canvas,#touch,.tbtn,#dpad'));
  // touchstart/touchend on the game surfaces: no zoom, no text callout, no ghost click. Pointer events (pointerdown/up) still
  // fire for every finger, so holding the joystick + pressing A (multi-touch) keeps working. The gesture listeners that unlock
  // audio / speech (touchend, capture) still run, because preventDefault does not stop other handlers.
  document.addEventListener('touchstart',e=>{ if(onGame(e.target) || e.touches.length>1) stop(e); },{passive:false});
  document.addEventListener('touchmove',e=>{ stop(e); },{passive:false});            // no scrolling and no pinch (touches>1) anywhere
  let lastEnd=0;
  document.addEventListener('touchend',e=>{ const now=Date.now(); if(onGame(e.target) || now-lastEnd<300) stop(e); lastEnd=now; },{passive:false}); // double-tap zoom
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,stop,{passive:false}));      // Safari pinch gestures
  document.addEventListener('dblclick',stop,{passive:false});
  // recovery: if Safari still ends up zoomed in, rewrite the viewport meta (toggle it) so the page snaps back to 1, then re-layout
  const meta=document.querySelector('meta[name=viewport]'), base=meta?meta.getAttribute('content'):'';
  let fixing=false;
  function unzoom(){ const vv=window.visualViewport, sc=vv?vv.scale:1;
    if(sc>1.01 && meta && !fixing){ fixing=true; window.__unzooms=(window.__unzooms||0)+1;
      meta.setAttribute('content','width=device-width, initial-scale=1.01, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
      setTimeout(()=>{ meta.setAttribute('content',base); window.scrollTo(0,0); resize(); fixing=false; },60); }
    if(document.scrollingElement && (document.scrollingElement.scrollTop||document.scrollingElement.scrollLeft)) window.scrollTo(0,0); }
  window.unzoom=unzoom;
  if(window.visualViewport){ visualViewport.addEventListener('resize',()=>{ unzoom(); resize(); }); visualViewport.addEventListener('scroll',unzoom); }
  addEventListener('orientationchange',()=>setTimeout(()=>{ unzoom(); resize(); },250));
  addEventListener('resize',unzoom);
  document.addEventListener('touchend',()=>setTimeout(unzoom,350),{passive:true});
})();
function resize(){
  const availH = isTouch && innerHeight>innerWidth ? innerHeight*0.62 : innerHeight;
  const s = Math.min(innerWidth/W, availH/H);
  cv.style.width = Math.floor(W*s)+'px'; cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize',resize); resize();

// ================== AUDIO ==================
let AC = null, muted = false;
function beep(f, d, type, vol, slide){
  if (!AC || muted) return;
  if (AC.state==='suspended') { try{AC.resume();}catch(e){} }
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type||'square'; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  } catch(e){}
}
// ================== MUSIC (music v10) ==================
// Original looping chiptune / medieval themes, scheduled with a Web Audio lookahead scheduler.
let musicOn=true, voicesOn=true, audioUnlocked=false;
const MUSIC_BASE=0.9;                      // music voices peak ~0.02 vs SFX ~0.05  =>  music sits at ~40-50% of SFX
const MUS={master:null,cur:null,name:undefined,timer:null,level:-1,notes:0};
function midiOf(n){ if(/^\d+$/.test(n)) return +n; const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); if(!m) return 60;
  return (+m[3]+1)*12+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }
const mfreq=n=>440*Math.pow(2,(midiOf(n)-69)/12);
const TK=str=>str.trim().split(/\s+/).filter(t=>t!=='|');
// pad: one held chord per bar.  chord tokens look like 'F3+A3+C4'
const padT=(chords,n)=>TK(chords.map(c=>c+' -'.repeat(n-1)).join(' '));
// bass: a rhythm pattern per bar, R=root F=fifth O=octave (numbers = midi notes)
const bassT=(roots,pat)=>TK(roots.map(r=>pat.split(' ').map(p=>p==='R'?midiOf(r):p==='F'?midiOf(r)+7:p==='O'?midiOf(r)+12:p).join(' ')).join(' '));
// arpeggio ("guitar"): chord tones picked in a pattern of indexes per bar
const arpT=(chords,pat)=>TK(chords.map(c=>{const ns=c.split('+');return pat.split(' ').map(p=>p==='.'||p==='-'?p:ns[+p%ns.length]).join(' ');}).join(' '));
const SONGS={
  overworld:{bpm:132,voices:[   // cheerful village / overworld theme, C major
    {w:'square',v:0.016,t:TK(`C5 - E5 G5 A5 - G5 E5 | F5 - A5 F5 E5 - C5 - | D5 - F5 A5 G5 - E5 C5 | D5 - - - G4 - . . |
                               C5 - E5 G5 A5 - G5 E5 | F5 - A5 C6 B5 - G5 - | A5 G5 F5 E5 D5 - G5 - | C5 - - - . . . .`)},
    {w:'triangle',v:0.04,t:bassT(['C3','F3','G3','G3','C3','F3','G3','C3'],'R . F . R . F .')},
    {w:'triangle',v:0.007,t:padT(['C4+E4+G4','F4+A4+C5','G4+B4+D5','G4+B4+D5','C4+E4+G4','F4+A4+C5','G4+B4+D5','C4+E4+G4'],8)}]},
  castle:{bpm:96,voices:[       // regal castle theme, D major
    {w:'square',v:0.014,t:TK(`D5 - - A4 D5 - F#5 - | A5 - - - F#5 - D5 - | G5 - F#5 - E5 - D5 - | E5 - - - A4 - - - |
                              D5 - - A4 D5 - F#5 - | A5 - - B5 A5 - F#5 - | G5 - E5 - C#5 - E5 - | D5 - - - - - . .`)},
    {w:'triangle',v:0.04,t:bassT(['D3','D3','G2','A2','D3','D3','A2','D3'],'R - - R F - R -')},
    {w:'triangle',v:0.008,t:padT(['D4+F#4+A4','D4+F#4+A4','G4+B4+D5','A4+C#5+E5','D4+F#4+A4','F#4+A4+D5','A4+C#5+E5','D4+F#4+A4'],8)}]},
  cave:{bpm:70,voices:[         // spooky slow tunnel theme, A minor
    {w:'triangle',v:0.024,a:0.05,t:TK(`A4 - - - C5 - B4 - | A4 - - - E4 - - - | F4 - - - E4 - D#4 - | E4 - - - - - . . |
                                       A4 - - - C5 - E5 - | D5 - - - C5 - B4 - | C5 - B4 - A4 - G#4 - | A4 - - - - - . .`)},

const WOODS_LOG={};
function thinWoods(m,W0,H0){

    ((x===11||x===14)&&y>=10&&y<=21) || ((y===10||y===13)&&x>=5&&x<=14) || // hidden path flanks
    inR(x,y,14,26,20,32) || inR(x,y,40,1,46,7) ||     // old meadow, lost-cross grove
    inR(x,y,1,26,7,32);                               // mobile v11: Mia's deep-forest clearing

  for(const [cx,cy] of MEADOWS){ const rad=1.3+r()*0.9;

  const cand=[]; for(let y=1;y<h-1;y++)for(let x=1;x<=22;x++) if(isT(x,y)&&zone(x,y)){
    const o=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>!SOLID.has(m[y+b][x+a])).length;
    cand.push([noise(x,y)+0.12*o+r()*0.25,x,y]); }

  for(const [tx,ty,dx,dy,r] of [[3,9,1,1,40],[13,2,1,1,44],[17,2,-1,1,44],[12,19,-1,1,36],[3,23,1,-1,36],[8,22,1,1,30],[12,29,-1,-1,30],[17,14,-1,-1,36]]) drawCobweb(g,tx*TS,ty*TS,dx,dy,r);
  // glowing crystals along the walls
  for(const [x,y,c] of [[7,27,'#7ef0ff'],[12,24,'#ff8ef0'],[2,20,'#a0ff8e'],[7,14,'#7ef0ff'],[2,12,'#ff8ef0'],[9,8,'#a0ff8e'],[17,11,'#7ef0ff'],[12,4,'#ff8ef0'],[17,3,'#a0ff8e']]){
    const px=x*TS+16, py=y*TS+20; const gr=g.createRadialGradient(px,py,2,px,py,34); gr.addColorStop(0,c+'55'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(px,py,34,0,Math.PI*2); g.fill();
    for(const [dx,s2] of [[-6,0.7],[0,1],[6,0.6]]){ g.fillStyle=c; g.beginPath(); g.moveTo(px+dx,py-14*s2); g.lineTo(px+dx+5*s2,py); g.lineTo(px+dx,py+6); g.lineTo(px+dx-5*s2,py); g.fill();
      g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(px+dx,py-14*s2); g.lineTo(px+dx+2,py); g.lineTo(px+dx,py+2); g.fill(); } }
  // little rocks & bones-free pebbles
  const r=mulberry32(7); for(let i=0;i<60;i++){ const x=Math.floor(r()*20), y=Math.floor(r()*30); if(TUNNEL_TMP && TUNNEL_TMP.t[y][x]===T.CFLOOR){ ell(g,x*TS+8+r()*16,y*TS+10+r()*16,3+r()*3,2+r()*2,'#4a3c5a'); } }
  // the dragon door: dark arch with warm glow and scorch marks
  { const x=14*TS, y=1*TS; g.fillStyle='#2a2036'; g.beginPath(); g.arc(x+32,y+30,36,Math.PI,0); g.fill();
    const gr=g.createRadialGradient(x+32,y+26,4,x+32,y+26,40); gr.addColorStop(0,'rgba(255,150,60,.9)'); gr.addColorStop(1,'rgba(255,80,30,0)');
    g.fillStyle='#120a18'; g.beginPath(); g.arc(x+32,y+32,26,Math.PI,0); g.lineTo(x+58,y+32); g.lineTo(x+6,y+32); g.fill();
    g.fillStyle=gr; g.beginPath(); g.arc(x+32,y+26,40,0,Math.PI*2); g.fill(); }
  // daylight at the entrance
  { const gr=g.createLinearGradient(0,29*TS+32,0,26*TS); gr.addColorStop(0,'rgba(255,240,180,.45)'); gr.addColorStop(1,'rgba(255,240,180,0)');
    g.fillStyle=gr; g.fillRect(8*TS,26*TS,4*TS,4*TS); }
}

// ================== TILE ART ==================
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function ell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}
function rrect(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}
function grassBase(g,px,py,r){g.fillStyle=r()<0.5?'#6cc24a':'#67bd45';g.fillRect(px,py,TS,TS);
  if(r()<0.4){g.fillStyle='#58a93b';for(let i=0;i<3;i++){const a=px+2+r()*26,b=py+2+r()*24;g.fillRect(a,b,2,5);g.fillRect(a+3,b+1,2,4);}}}
function drawTile(g,t,px,py,r){
  switch(t){
  case T.GRASS: grassBase(g,px,py,r); break;
  case T.FLOWER: grassBase(g,px,py,r); {const cols=['#ff6b8a','#fff35c','#ffffff','#b48cff','#ff9f43'];
    for(let i=0;i<3;i++){const x=px+5+r()*22,y=py+5+r()*22;g.fillStyle='#3f8f2d';g.fillRect(x-0.5,y,1.5,5);
      circ(g,x,y,3,cols[Math.floor(r()*cols.length)]);circ(g,x,y,1.2,'#ffd23f');}} break;
  case T.TREE: grassBase(g,px,py,r); ell(g,px+16,py+28,11,4,'rgba(0,0,0,.18)');
    g.fillStyle='#7a4a21';g.fillRect(px+13,py+18,6,11);
    circ(g,px+16,py+13,13,r()<0.5?'#2e8b3a':'#2a8035');circ(g,px+10,py+16,7,'#2e8b3a');circ(g,px+22,py+16,7,'#2e8b3a');
    circ(g,px+12,py+9,5,'#43a852');circ(g,px+19,py+7,3,'#5cbf62'); break;
  case T.WATER: g.fillStyle='#3aa0e8';g.fillRect(px,py,TS,TS); g.strokeStyle='#76c4fb';g.lineWidth=2;
    for(let i=0;i<2;i++){const x=px+4+r()*18,y=py+6+r()*20;g.beginPath();g.arc(x,y,4,Math.PI*1.1,Math.PI*1.9);g.stroke();} break;
  case T.BRIDGE: g.fillStyle='#3aa0e8';g.fillRect(px,py,TS,TS);g.fillStyle='#b07a40';g.fillRect(px,py+1,TS,TS-2);
    g.fillStyle='#7a4f24';for(let i=0;i<4;i++)g.fillRect(px+i*8,py+1,1.5,TS-2);
    g.fillStyle='#c9925a';g.fillRect(px,py+1,TS,2); break;
  case T.PATH: g.fillStyle='#e3c98c';g.fillRect(px,py,TS,TS);g.fillStyle='#cdb073';
    for(let i=0;i<4;i++)g.fillRect(px+r()*28,py+r()*28,3,3); break;
  case T.WALL: g.fillStyle='#9aa0a8';g.fillRect(px,py,TS,TS);g.fillStyle='#7c828a';
    for(let row=0;row<4;row++){g.fillRect(px,py+row*8,TS,1.5);const off=row%2?0:8;for(let k=off;k<TS;k+=16)g.fillRect(px+k,py+row*8,1.5,8);}
    g.fillStyle='#b4bac2';g.fillRect(px,py,TS,2); break;
  case T.FLOOR: g.fillStyle=((px/TS+py/TS)%2)?'#e2dccd':'#d4cdbc';g.fillRect(px,py,TS,TS); break;
  case T.CARPET: g.fillStyle='#d4cdbc';g.fillRect(px,py,TS,TS);g.fillStyle='#c8323c';g.fillRect(px,py,TS,TS);
    g.fillStyle='#f2c94c';g.fillRect(px+(px/TS%2?TS-3:0),py,3,TS); break;
  case T.ROCK: { const hill = r()<2; if(hill){g.fillStyle='#8cc65a';g.fillRect(px,py,TS,TS);} ell(g,px+16,py+26,13,5,'rgba(0,0,0,.2)');
    ell(g,px+16,py+18,13,11,'#8f949a');ell(g,px+13,py+14,7,5,'#b3b8be');ell(g,px+21,py+22,4,3,'#767b81'); } break;
  case T.HILL: g.fillStyle=r()<0.5?'#8cc65a':'#88c157';g.fillRect(px,py,TS,TS);
    if(r()<0.35){g.strokeStyle='#76ad48';g.lineWidth=2;g.beginPath();g.arc(px+16,py+30,12,Math.PI*1.15,Math.PI*1.85);g.stroke();} break;
  case T.SAND: g.fillStyle=r()<0.5?'#e3cf93':'#dec98c';g.fillRect(px,py,TS,TS);g.fillStyle='#c9b274';
    for(let i=0;i<3;i++)g.fillRect(px+r()*28,py+r()*28,2,2); break;
  case T.MOUNTAIN: g.fillStyle='#7d6450';g.fillRect(px,py,TS,TS);g.fillStyle='#977a62';
    g.beginPath();g.moveTo(px,py+TS);g.lineTo(px+12,py+6);g.lineTo(px+24,py+TS);g.fill();
    g.fillStyle='#6a5241';g.beginPath();g.moveTo(px+14,py+TS);g.lineTo(px+26,py+12);g.lineTo(px+TS+4,py+TS);g.fill(); break;
  case T.CAVE: g.fillStyle='#7d6450';g.fillRect(px,py,TS,TS);g.fillStyle='#1a1020'; g.fillRect(px,py+8,TS,TS-8); break;
  case T.CFLOOR: g.fillStyle=r()<0.5?'#5d4b6e':'#594869';g.fillRect(px,py,TS,TS);g.fillStyle='#4e3e5e';
    for(let i=0;i<3;i++)g.fillRect(px+r()*28,py+r()*28,3,2); break;
  case T.CWALL: g.fillStyle='#3a2e48';g.fillRect(px,py,TS,TS);g.fillStyle='#4a3c5a';
    ell(g,px+10,py+12,8,6,'#4a3c5a');ell(g,px+23,py+22,7,5,'#2f253b'); break;
  case T.LAIRDOOR: g.fillStyle='#3a2e48';g.fillRect(px,py,TS,TS); break;
  case T.EXIT: g.fillStyle='#e3cf93';g.fillRect(px,py,TS,TS);g.fillStyle='#fff6c8';g.fillRect(px+4,py+10,24,22); break;
  default: grassBase(g,px,py,r);
  }
}

function drawPen(g){
  const x0=PEN.x0,y0=PEN.y0,x1=PEN.x1,y1=PEN.y1;
  g.fillStyle='#d9c27a';g.fillRect(x0+4,y0+4,x1-x0-8,y1-y0-8);
  g.fillStyle='#c4aa5c';for(let i=0;i<60;i++){const a=(i*37)%120,b=(i*53)%120;g.fillRect(x0+6+a,y0+6+b,4,1.5);}
  // little hen house in the corner
  g.fillStyle='#b5651d';g.fillRect(x1-44,y1-40,34,26);g.fillStyle='#d62828';g.beginPath();g.moveTo(x1-48,y1-38);g.lineTo(x1-27,y1-54);g.lineTo(x1-6,y1-38);g.fill();
  g.fillStyle='#3a2410';g.beginPath();g.arc(x1-27,y1-14,7,Math.PI,0);g.fill();
  // water trough
  rrect(g,x0+10,y1-24,26,10,3,'#8a5a2b');g.fillStyle='#8fd3ff';g.fillRect(x0+13,y1-22,20,5);
  // fence posts & rails
  const post=(x,y)=>{g.fillStyle='#6a4520';g.fillRect(x-3,y-12,6,14);g.fillStyle='#8a5a2b';g.fillRect(x-2,y-12,4,3);};
  g.fillStyle='#a8743f';
  const railH=(xa,xb,y)=>{g.fillRect(xa,y-9,xb-xa,3);g.fillRect(xa,y-4,xb-xa,3);};
  railH(x0,x0+32,y0);railH(x0+96,x1,y0);railH(x0,x1,y1);
  g.fillRect(x0-2,y0-6,4,y1-y0);g.fillRect(x1-2,y0-6,4,y1-y0);
  for(let x=x0;x<=x1;x+=32){post(x,y1); if(x<=x0+32||x>=x0+96) post(x,y0);}
  for(let y=y0+32;y<y1;y+=32){post(x0,y);post(x1,y);}
  // open gate
  g.fillStyle='#c9925a';g.save();g.translate(x0+32,y0);g.rotate(-0.9);g.fillRect(0,-9,30,3);g.fillRect(0,-4,30,3);g.restore();
  // sign
  g.fillStyle='#7a4a21';g.fillRect(x0+60,y0-30,4,20);rrect(g,x0+42,y0-44,40,16,3,'#e8c98a');
  g.fillStyle='#5a3a1a';g.font='bold 9px Verdana';g.textAlign='center';g.fillText('HENS',x0+62,y0-32);
}

function drawCastleDeco(g,C){

    for(let a=0;a<8;a++){const an=a*Math.PI/4;g.fillStyle='#7c828a';g.fillRect(x+Math.cos(an)*19-3,y+Math.sin(an)*19-3,6,6);}
    g.fillStyle='#5a3a1a';g.fillRect(x-1,y-28,2,24);g.fillStyle='#d62828';g.beginPath();g.moveTo(x+1,y-28);g.lineTo(x+16,y-23);g.lineTo(x+1,y-18);g.fill();}

  g.fillStyle='#6a7078';g.fillRect(32*TS-6,C.y1*TS,6,TS);g.fillRect(34*TS,C.y1*TS,6,TS);

function boxHits(m,x,y,hw,hh){return solidAt(m,x-hw,y-hh)||solidAt(m,x+hw,y-hh)||solidAt(m,x-hw,y+hh)||solidAt(m,x+hw,y+hh)||(m===WORLD&&decoHit(x,y,hw,hh));}

function moveEnt(e,dx,dy,hw,hh,isPlayer){
  const steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/8)||1;
  for(let i=0;i<steps;i++){
    const sx=dx/steps, sy=dy/steps;
    if(!boxHits(map,e.x+sx,e.y,hw,hh) && !(isPlayer&&npcBlock(e.x+sx,e.y))) e.x+=sx;
    if(!boxHits(map,e.x,e.y+sy,hw,hh) && !(isPlayer&&npcBlock(e.x,e.y+sy))) e.y+=sy;

function updateDragon(dt){
  if(!D) return;
  D.t+=dt; D.stateT+=dt; if(D.hurt>0) D.hurt-=dt;
  const angry = D.hp<=6;
  if(D.state==='fly'){
    D.x = 320 + Math.sin(D.t*(angry?0.95:0.7))*200; D.y = D.baseY + Math.sin(D.t*1.7)*14;
    D.shootT-=dt;
    if(D.shootT<=0){
      D.shootT = angry?1.3:1.8; D.shots++;
      const ang=Math.atan2(P.y-14-(D.y-20),P.x-D.x);
      const spread = angry?[-0.25,0,0.25]:[0];
      for(const s of spread) fireballs.push({x:D.x,y:D.y-14,vx:Math.cos(ang+s)*120,vy:Math.sin(ang+s)*120,life:5});
      beep(300,0.15,'sawtooth',0.04,150);
      if(D.shots>=(angry?4:3)){D.state='land';D.stateT=0;D.shots=0;D.fromY=D.y;}
    }
    // contact
    if(Math.abs(P.x-D.x)<38 && P.y>D.y-50 && P.y<D.y+46) dragonHurt(D.x,D.y);
  } else if(D.state==='land'){
    const p=Math.min(1,D.stateT/0.7); D.y = D.fromY + (250-D.fromY)*p;
    if(p>=1){D.state='rest';D.stateT=0;G.shake=0.2;beep(90,0.3,'square',0.06);}
  } else if(D.state==='rest'){
    if(D.stateT>3.2){D.state='rise';D.stateT=0;}
  } else if(D.state==='rise'){
    const p=Math.min(1,D.stateT/0.8); D.y = 250 + (D.baseY-250)*p;
    if(p>=1){D.state='fly';D.stateT=0;D.shootT=1.2;}
  } else if(D.state==='tamed'){
    D.y += Math.sin(D.t*4)*0.3;
    if(Math.random()<0.3) particles.push({x:D.x+(Math.random()-0.5)*80,y:D.y-40,vx:0,vy:-40,life:1,col:['#ff5c8a','#ffe14d','#7ef0ff'][Math.floor(Math.random()*3)],size:3});
    if(D.stateT>2.4 && !D.saidBye){D.saidBye=true;
      startDialog([{who:'Grumblefire the Dragon',text:"Okay, okay! You win, George! You're too brave for me!"},
        {who:'Grumblefire the Dragon',text:"I promise to stop roaring at night and never scare the sheep again. Can we be friends?"},
        {who:'George',text:"Of course! Silene is safe, and now we have a dragon friend!"}],()=>{ startFeast(); });}   // feast v11: banquet + Grace before the victory screen
  }
  // fireballs
  for(const f of fireballs){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;
    if(solidAt(map,f.x,f.y)) f.life=0;
    if(f.life>0 && Math.hypot(f.x-P.x,f.y-(P.y-12))<16){ f.life=0; dragonHurt(f.x,f.y); }
  }
  fireballs=fireballs.filter(f=>f.life>0);
}
function hitDragon(){
  if(!D||D.hurt>0||D.state==='tamed') return;
  if(P.atk!=='spear'){ SFX.clang(); addText(D.x,D.y-78,"Clink! The sword can't hurt it.",'#cfe8ff'); addText(D.x,D.y-58,G.hasSpear?'Use the Holy Spear ('+spearKey()+')!':'Only the Holy Spear works!','#ffe14d'); D.hurt=0.3; G.swordClinks=(G.swordClinks||0)+1; return; }

}

function update(dt){

        {who:'Tip',text:"Now go to the dragon's cave in the south-east."}]); } break;

function carveSecrets(m){ for(const S of SECRETS){ const [x0,y0,x1,y1]=S.box, axe=S.tool==='axe';

const DIRV={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]};
function nearObst(kind){ if(map!==WORLD) return null; let best=null,bd=52; for(const o of OBST){ if(o.gone||(kind&&o.kind!==kind)) continue; const d=Math.hypot(o.x-P.x,o.y-P.y); if(d<bd){bd=d;best=o;} } return best; }

  for(const d of order){ const v=DIRV[d]; for(const r of [28,42,56]){ const x=P.x+v[0]*r, y=P.y-4+v[1]*r; if(tileAt(map,x,y)===T.WATER){
        let bx=P.x+v[0]*(r+12), by=P.y-4+v[1]*(r+12); if(tileAt(map,bx,by)!==T.WATER){ bx=x; by=y; } return {dir:d,x:bx,y:by}; } } } return null; }
function contextTool(){ if(!G.tools) return null; const has=id=>!!G.tools[id];

function prayerPages(Q,dt){ const PR=PRAYERS[Q.kind], pages=PR.pages;

    Q.saying=speak(pages[pg].join(' '),PR.who,{prayer:true,onend:()=>{ if(G.prayer===Q&&Q.spoken===pg) Q.sayDone=true; }}); }
  if(Q.saying && !Q.sayDone && (!voiceReady() || (!VO.started && Q.t>3))) Q.saying=false;   // voices switched off / no speech engine output: fall back
  let next=false;
  if(Q.saying){ if(pv.action&&Q.t>0.8) Q.want=true;
    if(Q.sayDone){ Q.doneT+=dt; if(Q.want||Q.doneT>=0.9) next=true; }
    else if(Q.t>=(autoText?autoSpeechMax(pages[Q.page].join(' '),PRAYER_RATE):40)) next=true; }   // safety net if a browser never fires onend (autotext v13: sooner)

  if(G.vt>1.5 && Math.sin(G.vt*4)>-0.3){ctx.font='bold 20px Verdana';outlined(ctx,padSeen?'Press A or START to play again':isTouch?'Tap to play again':'Press SPACE or R to play again',W/2,458,'#fff','#d62828',6);}
}

// ================== MAIN LOOP ==================
buildMaps();
P={x:0,y:0,dir:'down'};
toTitle();
let last=performance.now(), frames=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; frames++;
  try { pollGamepad(); if(toast.t>0) toast.t-=dt; update(dt); render(); musicUpdate(); syncTouchUI(); } catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// expose for testing/debug
window.__sg = {get G(){return G;},get P(){return P;},get D(){return D;},get frames(){return frames;},get map(){return map;},get foes(){return foes;},get items(){return items;},
  WORLD:()=>WORLD, LAIR:()=>LAIR, TUNNEL:()=>TUNNEL, enterLair, enterTunnel, hitDragon, update, render};
