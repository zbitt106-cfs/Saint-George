<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saint George &amp; the Dragon</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1b1530;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Verdana,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  body.touch #wrap{align-items:flex-start;padding-top:env(safe-area-inset-top)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
    box-shadow:0 0 30px rgba(0,0,0,.6);border-radius:6px}
  #touch{display:none}
  body.touch #touch{display:block}
  #dpad{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);touch-action:none}
  #dpad:before,#dpad:after{content:"";position:absolute;background:rgba(255,255,255,.35);border-radius:6px}
  #dpad:before{left:62px;top:14px;width:26px;height:122px}
  #dpad:after{top:62px;left:14px;height:26px;width:122px}
  #knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6);z-index:2;pointer-events:none}
  .tbtn{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.6);color:#fff;font-weight:bold;
    display:flex;align-items:center;justify-content:center;touch-action:none;text-shadow:0 2px 2px rgba(0,0,0,.5)}
  #btnA{right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:86px;height:86px;background:rgba(220,50,60,.75);font-size:30px}
  #btnS{right:124px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;background:rgba(200,200,215,.75);font-size:26px}
  #btnSp{right:30px;bottom:calc(140px + env(safe-area-inset-bottom));width:66px;height:66px;background:rgba(240,190,40,.85);font-size:15px;display:none}
  body.touch.spear #btnSp{display:flex}
  #btnM{right:14px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;background:rgba(120,60,170,.7);font-size:20px}
  #btnM.off{opacity:.45}
  #btnQ{right:66px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;background:rgba(60,120,220,.75);font-size:20px}
  #btnD{right:124px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;background:rgba(60,170,110,.8);font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="tbtn" id="btnA">A</div>
  <div class="tbtn" id="btnQ">&#9776;</div>
  <div class="tbtn" id="btnS">&#128737;</div>
  <div class="tbtn" id="btnSp">SPEAR</div>
  <div class="tbtn" id="btnD">DASH</div>
  <div class="tbtn" id="btnM">&#9834;</div>
</div>
<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TS = 32, W = 640, H = 480;
const MW = 72, MH = 52;
const T = {GRASS:0,TREE:1,WATER:2,BRIDGE:3,PATH:4,WALL:5,FLOOR:6,HOUSE:7,FLOWER:8,ROCK:9,SAND:10,CAVE:11,
  CARPET:12,FOUNTAIN:13,MOUNTAIN:14,HILL:15,CFLOOR:16,CWALL:17,EXIT:18,LAIRDOOR:19};
const SOLID = new Set([T.TREE,T.WATER,T.WALL,T.HOUSE,T.ROCK,T.FOUNTAIN,T.MOUNTAIN,T.CWALL]);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const tc = t => t*TS+TS/2; // tile center

// ================== INPUT ==================
const keys = {}; let pv = {}; // pv = virtual buttons pressed this frame
const touchDir = {x:0,y:0}; let touchBlock=false, padBlock=false;
function blockHeld(){ return !!(keys['shift']||keys['x']||padBlock||touchBlock); }
const KEYMAP = {' ':'action','e':'action','enter':'action','z':'action','q':'pause','tab':'pause','p':'pause','escape':'pause','r':'restart','m':'mute','n':'music','v':'voices','f':'spear','c':'dash','control':'dash'};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k] && KEYMAP[k]) pv[KEYMAP[k]] = true;
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright','tab','control'].includes(k)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchBlock=false; });
function inputDir(){
  let x=0,y=0;
  if (keys['arrowleft']||keys['a']) x-=1;
  if (keys['arrowright']||keys['d']) x+=1;
  if (keys['arrowup']||keys['w']) y-=1;
  if (keys['arrowdown']||keys['s']) y+=1;
  x+=touchDir.x+padDir.x; y+=touchDir.y+padDir.y;
  x=clamp(x,-1,1); y=clamp(y,-1,1);
  return {x,y};
}
// gamepad (Xbox / PlayStation via standard mapping)
const padDir={x:0,y:0}; let padPrev=[], padSeen=false; const toast={text:'',t:0};
function showToast(s){toast.text=s;toast.t=2.6;}
addEventListener('gamepadconnected',()=>{if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}});
addEventListener('gamepaddisconnected',()=>{padSeen=false;padPrev=[];showToast('Controller disconnected');});
function pollGamepad(){
  padDir.x=0;padDir.y=0;
  let pads=[]; try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  let gp=null; for(const p of (pads||[])){ if(p&&p.connected!==false&&p.buttons&&p.buttons.length){gp=p;break;} }
  if(!gp){padPrev=[];padBlock=false;return;}
  if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}
  const btn=i=>{const b=gp.buttons[i];return !!(b&&(b.pressed||b.value>0.5));};
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0, dz=0.35;
  if(Math.abs(ax)>dz) padDir.x=Math.sign(ax);
  if(Math.abs(ay)>dz) padDir.y=Math.sign(ay);
  if(padDir.x&&padDir.y){ if(Math.abs(ax)>Math.abs(ay)*2.2) padDir.y=0; else if(Math.abs(ay)>Math.abs(ax)*2.2) padDir.x=0; }
  if(btn(12))padDir.y=-1; if(btn(13))padDir.y=1; if(btn(14))padDir.x=-1; if(btn(15))padDir.x=1;
  const now=[]; for(let i=0;i<17;i++) now[i]=btn(i);
  padBlock = now[2]||now[4]||now[5];                                       // X / Square or LB / RB = hold to block
  const edge=i=>now[i]&&!padPrev[i];
  const m=G&&G.mode;
  if(edge(0)){pv.action=true;initAudio();}                                 // A / Cross
  if(edge(2) && (m==='title'||m==='dialog'||m==='victory')){pv.action=true;initAudio();} // X / Square also skips text
  if(edge(1)){ if(m==='pause') pv.back=true; else if(m==='dialog'||m==='title'||m==='victory') pv.action=true; else pv.spear=true; initAudio(); } // B / Circle = Holy Spear thrust (spear v10); closes pause
  if(edge(3)){ if(m==='dialog') pv.action=true; else pv.dash=true; initAudio(); } // Y / Triangle = dash (dash v10)
  if(edge(9)){ if(m==='title'||m==='victory'||m==='dialog') pv.action=true; else pv.pause=true; initAudio(); } // Start / Options = pause menu (pause v10)
  if(edge(8)) pv.pause=true;                                               // Back / Share also opens / closes the pause menu
  padPrev=now;
}
// touch
const isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if (isTouch) document.body.classList.add('touch');
(function setupTouch(){
  const dp = document.getElementById('dpad'), knob = document.getElementById('knob');
  let pid = null;
  function upd(e){
    const r = dp.getBoundingClientRect();
    let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
    const d = Math.hypot(dx,dy), max = 50;
    if (d>max){dx=dx/d*max;dy=dy/d*max;}
    knob.style.left = (50+dx)+'px'; knob.style.top = (50+dy)+'px';
    const dz = 14;
    touchDir.x = Math.abs(dx)>dz ? Math.sign(dx) : 0;
    touchDir.y = Math.abs(dy)>dz ? Math.sign(dy) : 0;
    if (Math.abs(dx) > Math.abs(dy)*2.2) touchDir.y = 0;
    if (Math.abs(dy) > Math.abs(dx)*2.2) touchDir.x = 0;
  }
  function end(){pid=null;touchDir.x=0;touchDir.y=0;knob.style.left='50px';knob.style.top='50px';}
  dp.addEventListener('pointerdown',e=>{pid=e.pointerId;dp.setPointerCapture(pid);upd(e);initAudio();e.preventDefault();});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  dp.addEventListener('pointerup',end); dp.addEventListener('pointercancel',end);
  function btn(id,name){const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{pv[name]=true;initAudio();b.style.filter='brightness(1.4)';e.preventDefault();});
    const off=()=>b.style.filter=''; b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off);}
  btn('btnA','action'); btn('btnQ','pause'); btn('btnSp','spear'); btn('btnM','music'); btn('btnD','dash');
  { const b=document.getElementById('btnS'); const on=e=>{touchBlock=true;initAudio();b.style.filter='brightness(1.4)';e.preventDefault();};
    const off=()=>{touchBlock=false;b.style.filter='';};
    b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); }
  cv.addEventListener('pointerdown',e=>{initAudio(); if(G.mode==='pause'){ const r=cv.getBoundingClientRect(); const i=pauseHit((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height); if(i>=0) pv.pauseTap=i+1; }
    else if(G.mode==='title'||G.mode==='victory'||G.mode==='dialog') pv.action=true;});
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
function resize(){
  const availH = isTouch && innerHeight>innerWidth ? innerHeight*0.62 : innerHeight;
  const s = Math.min(innerWidth/W, availH/H);
  cv.style.width = Math.floor(W*s)+'px'; cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize',resize); resize();

// ================== AUDIO ==================
let AC = null, muted = false;
function beep(f, d, type, vol, slide){
  if (!AC || muted) return;
  if (AC.state==='suspended') { try{AC.resume();}catch(e){} }
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type||'square'; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  } catch(e){}
}
// ================== MUSIC (music v10) ==================
// Original looping chiptune / medieval themes, scheduled with a Web Audio lookahead scheduler.
let musicOn=true, voicesOn=true, audioUnlocked=false;
const MUSIC_BASE=0.9;                      // music voices peak ~0.02 vs SFX ~0.05  =>  music sits at ~40-50% of SFX
const MUS={master:null,cur:null,name:undefined,timer:null,level:-1,notes:0};
function midiOf(n){ if(/^\d+$/.test(n)) return +n; const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); if(!m) return 60;
  return (+m[3]+1)*12+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }
const mfreq=n=>440*Math.pow(2,(midiOf(n)-69)/12);
const TK=str=>str.trim().split(/\s+/).filter(t=>t!=='|');
// pad: one held chord per bar.  chord tokens look like 'F3+A3+C4'
const padT=(chords,n)=>TK(chords.map(c=>c+' -'.repeat(n-1)).join(' '));
// bass: a rhythm pattern per bar, R=root F=fifth O=octave (numbers = midi notes)
const bassT=(roots,pat)=>TK(roots.map(r=>pat.split(' ').map(p=>p==='R'?midiOf(r):p==='F'?midiOf(r)+7:p==='O'?midiOf(r)+12:p).join(' ')).join(' '));
// arpeggio ("guitar"): chord tones picked in a pattern of indexes per bar
const arpT=(chords,pat)=>TK(chords.map(c=>{const ns=c.split('+');return pat.split(' ').map(p=>p==='.'||p==='-'?p:ns[+p%ns.length]).join(' ');}).join(' '));
const SONGS={
  overworld:{bpm:132,voices:[   // cheerful village / overworld theme, C major
    {w:'square',v:0.016,t:TK(`C5 - E5 G5 A5 - G5 E5 | F5 - A5 F5 E5 - C5 - | D5 - F5 A5 G5 - E5 C5 | D5 - - - G4 - . . |
                               C5 - E5 G5 A5 - G5 E5 | F5 - A5 C6 B5 - G5 - | A5 G5 F5 E5 D5 - G5 - | C5 - - - . . . .`)},
    {w:'triangle',v:0.04,t:bassT(['C3','F3','G3','G3','C3','F3','G3','C3'],'R . F . R . F .')},
    {w:'triangle',v:0.007,t:padT(['C4+E4+G4','F4+A4+C5','G4+B4+D5','G4+B4+D5','C4+E4+G4','F4+A4+C5','G4+B4+D5','C4+E4+G4'],8)}]},
  castle:{bpm:96,voices:[       // regal castle theme, D major
    {w:'square',v:0.014,t:TK(`D5 - - A4 D5 - F#5 - | A5 - - - F#5 - D5 - | G5 - F#5 - E5 - D5 - | E5 - - - A4 - - - |
                              D5 - - A4 D5 - F#5 - | A5 - - B5 A5 - F#5 - | G5 - E5 - C#5 - E5 - | D5 - - - - - . .`)},
    {w:'triangle',v:0.04,t:bassT(['D3','D3','G2','A2','D3','D3','A2','D3'],'R - - R F - R -')},
    {w:'triangle',v:0.008,t:padT(['D4+F#4+A4','D4+F#4+A4','G4+B4+D5','A4+C#5+E5','D4+F#4+A4','F#4+A4+D5','A4+C#5+E5','D4+F#4+A4'],8)}]},
  cave:{bpm:70,voices:[         // spooky slow tunnel theme, A minor
    {w:'triangle',v:0.024,a:0.05,t:TK(`A4 - - - C5 - B4 - | A4 - - - E4 - - - | F4 - - - E4 - D#4 - | E4 - - - - - . . |
                                       A4 - - - C5 - E5 - | D5 - - - C5 - B4 - | C5 - B4 - A4 - G#4 - | A4 - - - - - . .`)},
    {w:'sine',v:0.05,a:0.2,t:padT(['A2','A2','F2','E2','A2','D3','E2','A2'],8)},
    {w:'sine',v:0.006,a:0.4,t:padT(['A3+C4+E4','A3+C4+E4','F3+A3+C4','E3+G#3+B3','A3+C4+E4','D3+F3+A3','E3+G#3+B3','A3+C4+E4'],8)}]},
  dragon:{bpm:164,voices:[      // epic fast dragon fight, E minor
    {w:'square',v:0.016,t:TK(`E5 . E5 G5 F#5 . E5 D5 | E5 . B4 . E5 - - - | C5 . C5 E5 D5 . C5 B4 | A4 . B4 . C5 D5 D#5 - |
                              E5 . E5 G5 A5 . G5 F#5 | G5 . E5 . B5 - - - | C6 B5 A5 G5 F#5 E5 D#5 E5 | F#5 - D#5 - B4 - . .`)},
    {w:'sawtooth',v:0.018,t:bassT(['E2','E2','C2','A2','E2','E2','A2','B2'],'R R O R R O R O')},
    {w:'square',v:0.005,t:padT(['E4+G4+B4','E4+G4+B4','C4+E4+G4','A3+C4+E4','E4+G4+B4','E4+G4+B4','A3+C4+E4','B3+D#4+F#4'],8)}]},
  // 'Silene Hymn' (hymn v10): an ORIGINAL gentle hymn in F major, flowing 3/4 (6 eighth-steps a bar), stepwise singable melody,
  // soft organ pad + guitar-like arpeggio. Plays under the Our Father and the Hail Mary.
  hymn:{name:'Silene Hymn',bpm:80,voices:[
    {w:'organ',v:0.018,a:0.07,t:TK(`F4 - G4 - A4 - | A4 - - - G4 F4 | G4 - A4 - Bb4 - | A4 - - - - - |
                                    C5 - Bb4 - A4 - | G4 - A4 - F4 - | G4 - - - E4 - | F4 - - - - - |
                                    A4 - Bb4 - C5 - | D5 - C5 - A4 - | Bb4 - A4 - G4 - | A4 - - - - - |
                                    C5 - Bb4 - A4 - | G4 - - - A4 Bb4 | A4 - G4 - - - | F4 - - - - -`)},
    {w:'organ',v:0.006,a:0.25,t:padT(['F3+A3+C4','F3+A3+C4','G3+Bb3+D4','F3+A3+C4','F3+A3+C4','Bb2+D3+F3','C3+E3+G3','F3+A3+C4',
                                      'F3+A3+C4','D3+F3+A3','G3+Bb3+D4','F3+A3+C4','F3+A3+C4','G3+Bb3+D4','C3+E3+G3','F3+A3+C4'],6)},
    {w:'triangle',v:0.012,a:0.01,t:arpT(['F3+A3+C4','F3+A3+C4','G3+Bb3+D4','F3+A3+C4','F3+A3+C4','Bb2+D3+F3','C3+E3+G3','F3+A3+C4',
                                         'F3+A3+C4','D3+F3+A3','G3+Bb3+D4','F3+A3+C4','F3+A3+C4','G3+Bb3+D4','C3+E3+G3','F3+A3+C4'],'0 2 1 2 0 .')}]},
  victory:{bpm:120,then:'victoryLoop',voices:[   // short fanfare...
    {w:'square',v:0.02,t:TK(`G4 C5 E5 G5 - - E5 G5 | C6 - - - - - - - | . . . . . . . .`)},
    {w:'triangle',v:0.04,t:TK(`C3 - - - - - G2 - | C3 - - - - - - - | . . . . . . . .`)},
    {w:'triangle',v:0.008,t:padT(['C4+E4+G4','C4+E4+G4+C5','.'],8)}]},
  victoryLoop:{bpm:100,voices:[                 // ...then a gentle loop
    {w:'triangle',v:0.022,t:TK(`E5 - D5 C5 D5 - E5 - | G5 - - - E5 - - - | F5 - E5 D5 C5 - D5 - | E5 - - - - - . . |
                                E5 - D5 C5 D5 - E5 - | G5 - - - A5 - - - | G5 - E5 D5 D5 - C5 - | C5 - - - - - . .`)},
    {w:'triangle',v:0.035,t:bassT(['C3','C3','F3','C3','C3','F3','G3','C3'],'R . F . O . F .')},
    {w:'sine',v:0.008,a:0.2,t:padT(['C4+E4+G4','C4+E4+G4','F4+A4+C5','C4+E4+G4','C4+E4+G4','F4+A4+C5','G4+B4+D5','C4+E4+G4'],8)}]},
};
function playNote(dest,f,t,d,v){
  const a=v.a||0.012, peak=v.v, end=t+d, rel=Math.max(0.06,a*0.8);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a);
  const hold=Math.max(t+a+0.01,end-0.02); g.gain.linearRampToValueAtTime(peak*0.6,Math.min(hold,t+a+0.25)); g.gain.setValueAtTime(peak*0.6,hold); g.gain.linearRampToValueAtTime(0,hold+rel);
  g.connect(dest); const os=[];
  const mk=(type,fr,vol)=>{ const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(fr,t);
    let out=o; if(vol!==1){ const gg=AC.createGain(); gg.gain.value=vol; o.connect(gg); out=gg; o._gg=gg; } out.connect(g); o.start(t); o.stop(hold+rel+0.03); os.push(o); };
  if(v.w==='organ'){ mk('sine',f,1); mk('triangle',f*2,0.35); mk('sine',f*3,0.12); } else mk(v.w,f,1);
  MUS.notes++; let left=os.length;
  os.forEach(o=>o.onended=()=>{ try{o.disconnect(); if(o._gg) o._gg.disconnect();}catch(e){} if(--left===0){ try{g.disconnect();}catch(e){} MUS.notes--; } });
}
function musicStep(){                            // lookahead scheduler: runs every 25ms, schedules ~0.2s ahead
  if(!AC||!MUS.cur) return; const c=MUS.cur, now=AC.currentTime;
  if(c.next<now-0.25) c.next=now+0.05;           // tab was asleep: don't burst out a pile of old notes
  let guard=0;
  while(c.next<now+0.2 && guard++<64){ const part=c.part, sd=60/part.bpm/2, len=part.voices[0].t.length;
    for(const v of part.voices){ const tt=v.t, tk=tt[c.step%tt.length]; if(tk==='-'||tk==='.') continue;
      let n=1; while(n<24&&tt[(c.step+n)%tt.length]==='-') n++;
      tk.split('+').forEach(x=>playNote(c.g,mfreq(x),c.next,n*sd*0.96,v)); }
    c.next+=sd; c.step++;
    if(c.step>=len){ c.step=0; if(part.then) c.part=SONGS[part.then]; } }
}
function musicSet(name){                         // crossfade to another song (or to silence with null)
  if(!AC||!MUS.master||name===MUS.name) return; MUS.name=name; const now=AC.currentTime;
  if(MUS.cur){ const old=MUS.cur; MUS.cur=null;
    try{ old.g.gain.cancelScheduledValues(now); old.g.gain.setValueAtTime(old.g.gain.value,now); old.g.gain.linearRampToValueAtTime(0,now+0.7); }catch(e){}

function tileAt(m,px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=m.w||ty>=m.h)return T.TREE;return m.t[ty][tx];}
function solidAt(m,px,py){return SOLID.has(tileAt(m,px,py));}
function decoHit(x,y,hw,hh){ for(const r of DECO_SOLID){ if(x+hw>r[0]&&x-hw<r[0]+r[2]&&y+hh>r[1]&&y-hh<r[1]+r[3]) return true; } return false; }
function boxHits(m,x,y,hw,hh){return solidAt(m,x-hw,y-hh)||solidAt(m,x+hw,y-hh)||solidAt(m,x-hw,y+hh)||solidAt(m,x+hw,y+hh)||(m===WORLD&&decoHit(x,y,hw,hh));}
function npcBlock(x,y){ if(map!==WORLD) return false; for(const n of npcs){ if(n.follow) continue; if(Math.abs(n.x-x)<16&&Math.abs(n.y-y)<12) return true; } return false; }
function moveEnt(e,dx,dy,hw,hh,isPlayer){
  const steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/8)||1;
  for(let i=0;i<steps;i++){
    const sx=dx/steps, sy=dy/steps;
    if(!boxHits(map,e.x+sx,e.y,hw,hh) && !(isPlayer&&npcBlock(e.x+sx,e.y))) e.x+=sx;
    if(!boxHits(map,e.x,e.y+sy,hw,hh) && !(isPlayer&&npcBlock(e.x,e.y+sy))) e.y+=sy;
  }
}

function updateCobra(s,dt){ // King Hissalot: rear up (telegraph) -> lunge -> dizzy recover

        addText(s.x,s.y-80,'CLANG!','#cfe8ff'); addParticles(P.x,P.y-16,14,['#fff','#ffe14d','#cfe8ff'],170);

    }

function updateBat(s,dt){

  if(s.state==='sleep'){ if(dP<s.sight){ s.state='wake'; s.wakeT=0.45; beep(1800,0.06,'square',0.03,2600); setTimeout(()=>beep(2200,0.05,'square',0.025,1500),70);
      addText(s.x,s.y-34,'Squeak!','#e0c8ff'); } return; }

}

// ---- storm v9: a storm blows the golden cross off the church (plays once, after George's first spear piece or first side quest)
const STORM={darkIn:0.6, panOut:1.5, panIn:2.2, wobble:2.2, blow:3.0, flyEnd:4.4, panBack:4.6, back:5.3, end:6.0, flashes:[0.55,1.25,3.0]};
const SFX_STORM={
  thunder:()=>{ beep(120,0.9,'triangle',0.09,45); setTimeout(()=>beep(80,1.1,'triangle',0.07,40),120); setTimeout(()=>beep(60,0.8,'sine',0.05,35),380); },
  wind:()=>{ beep(260,1.4,'sine',0.035,520); setTimeout(()=>beep(420,1.1,'sine',0.025,220),300); },
};
function queueStorm(){ const X=G.side.cross; if(!X.storm) X.stormPending=true; }
function inCastle(){ return P.x>CASTLE.x0*TS&&P.x<(CASTLE.x1+1)*TS&&P.y>CASTLE.y0*TS&&P.y<(CASTLE.y1+1)*TS; }
function maybeStartStorm(){ const X=G.side.cross;

  if(P.carry) dropHen(false);
  P.attackT=0; P.kbT=0; P.block=false; P.walk=0;
  G.storm={t:0,cam0:{x:cam.x,y:cam.y},flash:-9,fired:{}}; G.mode='storm'; SFX_STORM.wind(); return true; }
function stormCamChurch(){ return {x:clamp(CHURCH.x*TS+80-W/2,0,WORLD.w*TS-W), y:clamp(CHURCH.y*TS-320,0,WORLD.h*TS-H)}; }
const ease=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
function stormWobble(t){ if(t<STORM.wobble) return Math.sin(t*9)*0.04; const k=(t-STORM.wobble)/(STORM.blow-STORM.wobble); return Math.sin(t*26)*(0.08+0.35*k); }
function stormCrossPos(t){ const u=clamp((t-STORM.blow)/(STORM.flyEnd-STORM.blow),0,1);
  const sx=CHURCH.x*TS+80, sy=CHURCH.y*TS-74, tx=CROSS_POS.x*TS+16, ty=CROSS_POS.y*TS+16;
  const dx=tx-sx, dy=ty-sy, d=Math.hypot(dx,dy), fly=Math.min(d,440)*u;
  return {x:sx+dx/d*fly, y:sy+dy/d*fly-Math.sin(u*Math.PI)*40, rot:u*14, sc:1.25-0.4*u}; }
function stormCaption(t){ return t<STORM.panOut?'Whoosh! A big STORM is coming!':t<STORM.blow?'Look at the little church!':t<STORM.panBack?'Oh no! The wind blew the golden cross away!':'The storm is over...'; }
function updateStorm(dt){ const S=G.storm; S.t+=dt; const t=S.t;
  { const cap=stormCaption(t); if(S.said!==cap){ S.said=cap; speak(cap,'Narrator'); } }
  for(const f of STORM.flashes) if(t>=f&&!S.fired[f]){ S.fired[f]=true; S.flash=t; SFX_STORM.thunder(); G.shake=0.25; }
  if(t>=STORM.wobble&&!S.fired.w){ S.fired.w=true; SFX_STORM.wind(); }
  if(t>=STORM.blow&&!S.fired.b){ S.fired.b=true; SFX_STORM.wind(); beep(900,0.5,'triangle',0.04,1500); }

function prayerPages(Q,dt){ const PR=PRAYERS[Q.kind], pages=PR.pages;
  if(Q.spoken!==Q.page){ const pg=Q.page; Q.spoken=pg; Q.sayDone=false; Q.doneT=0; Q.want=false;
    Q.saying=speak(pages[pg].join(' '),PR.who,{prayer:true,onend:()=>{ if(G.prayer===Q&&Q.spoken===pg) Q.sayDone=true; }}); }
  if(Q.saying && !Q.sayDone && (!voiceReady() || (!VO.started && Q.t>3))) Q.saying=false;   // voices switched off / no speech engine output: fall back
  let next=false;
  if(Q.saying){ if(pv.action&&Q.t>0.8) Q.want=true;
    if(Q.sayDone){ Q.doneT+=dt; if(Q.want||Q.doneT>=0.9) next=true; }
    else if(Q.t>=40) next=true; }                                    // safety net if a browser never fires onend
