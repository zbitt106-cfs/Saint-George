<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saint George &amp; the Dragon</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1b1530;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Verdana,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  body.touch #wrap{align-items:flex-start;padding-top:env(safe-area-inset-top)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
    box-shadow:0 0 30px rgba(0,0,0,.6);border-radius:6px}
  #touch{display:none}
  body.touch #touch{display:block}
  #dpad{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);touch-action:none}
  #dpad:before,#dpad:after{content:"";position:absolute;background:rgba(255,255,255,.35);border-radius:6px}
  #dpad:before{left:62px;top:14px;width:26px;height:122px}
  #dpad:after{top:62px;left:14px;height:26px;width:122px}
  #knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6);z-index:2;pointer-events:none}
  .tbtn{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.6);color:#fff;font-weight:bold;
    display:flex;align-items:center;justify-content:center;touch-action:none;text-shadow:0 2px 2px rgba(0,0,0,.5)}
  #btnA{right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:86px;height:86px;background:rgba(220,50,60,.75);font-size:30px}
  #btnQ{right:124px;bottom:calc(24px + env(safe-area-inset-bottom));width:54px;height:54px;background:rgba(60,120,220,.75);font-size:22px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="tbtn" id="btnA">A</div>
  <div class="tbtn" id="btnQ">&#9776;</div>
</div>
<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TS = 32, W = 640, H = 480;
const MW = 72, MH = 52;
const T = {GRASS:0,TREE:1,WATER:2,BRIDGE:3,PATH:4,WALL:5,FLOOR:6,HOUSE:7,FLOWER:8,ROCK:9,SAND:10,CAVE:11,
  CARPET:12,FOUNTAIN:13,MOUNTAIN:14,HILL:15,CFLOOR:16,CWALL:17,EXIT:18};
const SOLID = new Set([T.TREE,T.WATER,T.WALL,T.HOUSE,T.ROCK,T.FOUNTAIN,T.MOUNTAIN,T.CWALL]);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const tc = t => t*TS+TS/2; // tile center

// ================== INPUT ==================
const keys = {}; let pv = {}; // pv = virtual buttons pressed this frame
const touchDir = {x:0,y:0};
const KEYMAP = {' ':'action','e':'action','enter':'action','z':'action','q':'log','tab':'log','r':'restart','m':'mute'};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k] && KEYMAP[k]) pv[KEYMAP[k]] = true;
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function inputDir(){
  let x=0,y=0;
  if (keys['arrowleft']||keys['a']) x-=1;
  if (keys['arrowright']||keys['d']) x+=1;
  if (keys['arrowup']||keys['w']) y-=1;
  if (keys['arrowdown']||keys['s']) y+=1;
  x+=touchDir.x+padDir.x; y+=touchDir.y+padDir.y;
  x=clamp(x,-1,1); y=clamp(y,-1,1);
  return {x,y};
}
// gamepad (Xbox / PlayStation via standard mapping)
const padDir={x:0,y:0}; let padPrev=[], padSeen=false; const toast={text:'',t:0};
function showToast(s){toast.text=s;toast.t=2.6;}
addEventListener('gamepadconnected',()=>{if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}});
addEventListener('gamepaddisconnected',()=>{padSeen=false;padPrev=[];showToast('Controller disconnected');});
function pollGamepad(){
  padDir.x=0;padDir.y=0;
  let pads=[]; try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  let gp=null; for(const p of (pads||[])){ if(p&&p.connected!==false&&p.buttons&&p.buttons.length){gp=p;break;} }
  if(!gp){padPrev=[];return;}
  if(!padSeen){padSeen=true;showToast('\uD83C\uDFAE Controller connected!');}
  const btn=i=>{const b=gp.buttons[i];return !!(b&&(b.pressed||b.value>0.5));};
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0, dz=0.35;
  if(Math.abs(ax)>dz) padDir.x=Math.sign(ax);
  if(Math.abs(ay)>dz) padDir.y=Math.sign(ay);
  if(padDir.x&&padDir.y){ if(Math.abs(ax)>Math.abs(ay)*2.2) padDir.y=0; else if(Math.abs(ay)>Math.abs(ax)*2.2) padDir.x=0; }
  if(btn(12))padDir.y=-1; if(btn(13))padDir.y=1; if(btn(14))padDir.x=-1; if(btn(15))padDir.x=1;
  const now=[]; for(let i=0;i<17;i++) now[i]=btn(i);
  const edge=i=>now[i]&&!padPrev[i];
  const m=G&&G.mode;
  if(edge(0)||edge(2)){pv.action=true;initAudio();}                       // A / Cross (X / Square too)
  if(edge(1)||edge(3)){ if(m==='dialog') pv.action=true; else pv.log=true; } // B / Circle (Y / Triangle)
  if(edge(9)){ if(m==='title'||m==='victory'||m==='dialog') pv.action=true; else pv.log=true; } // Start / Options
  if(edge(8) && m==='log') pv.restart=true;                                // Back / Share in quest log = restart
  padPrev=now;
}
// touch
const isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if (isTouch) document.body.classList.add('touch');
(function setupTouch(){
  const dp = document.getElementById('dpad'), knob = document.getElementById('knob');
  let pid = null;
  function upd(e){
    const r = dp.getBoundingClientRect();
    let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
    const d = Math.hypot(dx,dy), max = 50;
    if (d>max){dx=dx/d*max;dy=dy/d*max;}
    knob.style.left = (50+dx)+'px'; knob.style.top = (50+dy)+'px';
    const dz = 14;
    touchDir.x = Math.abs(dx)>dz ? Math.sign(dx) : 0;
    touchDir.y = Math.abs(dy)>dz ? Math.sign(dy) : 0;
    if (Math.abs(dx) > Math.abs(dy)*2.2) touchDir.y = 0;
    if (Math.abs(dy) > Math.abs(dx)*2.2) touchDir.x = 0;
  }
  function end(){pid=null;touchDir.x=0;touchDir.y=0;knob.style.left='50px';knob.style.top='50px';}
  dp.addEventListener('pointerdown',e=>{pid=e.pointerId;dp.setPointerCapture(pid);upd(e);initAudio();e.preventDefault();});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  dp.addEventListener('pointerup',end); dp.addEventListener('pointercancel',end);
  function btn(id,name){const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{pv[name]=true;initAudio();b.style.filter='brightness(1.4)';e.preventDefault();});
    const off=()=>b.style.filter=''; b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off);}
  btn('btnA','action'); btn('btnQ','log');
  cv.addEventListener('pointerdown',e=>{initAudio(); if(G.mode==='title'||G.mode==='victory'||G.mode==='dialog'||G.mode==='log') pv.action=true;});
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
function resize(){
  const availH = isTouch && innerHeight>innerWidth ? innerHeight*0.62 : innerHeight;
  const s = Math.min(innerWidth/W, availH/H);
  cv.style.width = Math.floor(W*s)+'px'; cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize',resize); resize();

// ================== AUDIO ==================
let AC = null, muted = false;
function initAudio(){ if (AC) return; try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
function beep(f, d, type, vol, slide){
  if (!AC || muted) return;
  if (AC.state==='suspended') { try{AC.resume();}catch(e){} }
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type||'square'; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  } catch(e){}
}
const SFX = {
  swing:()=>beep(500,0.1,'triangle',0.06,200),
  poof:()=>{beep(300,0.15,'square',0.05,900);},
  hurt:()=>beep(220,0.25,'sawtooth',0.05,90),
  pickup:()=>{beep(660,0.08,'square',0.05);setTimeout(()=>beep(990,0.12,'square',0.05),80);},
  item:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.05),i*110));},
  talk:()=>beep(700+Math.random()*200,0.03,'square',0.025),
  roar:()=>beep(160,0.6,'sawtooth',0.07,60),
  hit:()=>beep(180,0.12,'square',0.07,120),
  clang:()=>beep(1200,0.08,'triangle',0.05,800),
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'square',0.05),i*150));},
};

// ================== MAP GENERATION ==================
function makeGrid(w,h,v){const m=[];for(let y=0;y<h;y++){m.push(new Array(w).fill(v));}return m;}
const VILLAGE = {x0:23,y0:25,x1:42,y1:45};
const CASTLE = {x0:26,y0:3,x1:39,y1:15};
const HOUSES = [{x:24,y:27,roof:'#d9443a'},{x:37,y:27,roof:'#3a6fd9'},{x:24,y:40,roof:'#e08a2c'},{x:37,y:40,roof:'#8a4fd0'}];
const FOUNTAIN = {x:32,y:34};
const HEAD_POS = {x:5,y:11}, SHAFT_POS = {x:64,y:7};
const CAVE_POS = {x:63,y:40};

function genWorld(){
  const m = makeGrid(MW,MH,T.GRASS);
  const r = mulberry32(2024);
  const inRect=(x,y,R)=>x>=R.x0&&x<=R.x1&&y>=R.y0&&y<=R.y1;
  // scattered flowers & trees
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if (r()<0.06) m[y][x]=T.FLOWER;
    if (x>21 && x<44 && !inRect(x,y,VILLAGE) && !inRect(x,y,{x0:24,y0:1,x1:41,y1:18}) && r()<0.05) m[y][x]=T.TREE;
  }
  // west forest
  for(let y=1;y<MH-1;y++)for(let x=1;x<=21;x++){ if (r() < (x>18?0.35:0.58)) m[y][x]=T.TREE; }
  // eastern hills
  for(let y=1;y<=27;y++)for(let x=51;x<MW-1;x++){ m[y][x] = r()<0.13 ? T.ROCK : T.HILL; }
  // scorched land near lair
  for(let y=30;y<MH-1;y++)for(let x=54;x<MW-1;x++){ m[y][x] = r()<0.05 ? T.ROCK : T.SAND; }
  // mountain with cave
  for(let y=40;y<MH;y++)for(let x=57;x<MW;x++){ if (y>40 || (x>57 && x<70)) m[y][x]=T.MOUNTAIN; }
  for(let y=41;y<MH;y++)for(let x=55;x<57;x++) m[y][x]=T.MOUNTAIN;
  // river
  for(let y=0;y<MH;y++){ const cx = 47+Math.round(Math.sin(y*0.23)*1.6); for(let dx=-1;dx<=1;dx++) m[y][cx+dx]=T.WATER; }
  // village clear
  for(let y=VILLAGE.y0;y<=VILLAGE.y1;y++)for(let x=VILLAGE.x0;x<=VILLAGE.x1;x++) if(m[y][x]!==T.FLOWER) m[y][x]=T.GRASS;
  // castle
  for(let y=CASTLE.y0;y<=CASTLE.y1;y++)for(let x=CASTLE.x0;x<=CASTLE.x1;x++){
    const edge = y===CASTLE.y0||y===CASTLE.y1||x===CASTLE.x0||x===CASTLE.x1;
    m[y][x] = edge ? T.WALL : T.FLOOR;
  }
  for(let y=CASTLE.y0-1;y<=CASTLE.y1+1;y++)for(let x=CASTLE.x0-1;x<=CASTLE.x1+1;x++){
    if (x<CASTLE.x0||x>CASTLE.x1||y<CASTLE.y0||y>CASTLE.y1) if(m[y][x]===T.TREE) m[y][x]=T.GRASS;
  }
  m[CASTLE.y1][32]=T.FLOOR; m[CASTLE.y1][33]=T.FLOOR;
  for(let y=6;y<=CASTLE.y1;y++){ m[y][32]=T.CARPET; m[y][33]=T.CARPET; }
  // carve paths
  function carve(x0,y0,x1,y1,tile){
    tile = tile===undefined?T.PATH:tile;
    const set=(x,y)=>{ if(x<1||y<1||x>=MW-1||y>=MH-1) return; const c=m[y][x];
      if (c===T.WATER) m[y][x]= tile===T.PATH?T.BRIDGE:c; else if (c!==T.FLOOR&&c!==T.CARPET&&c!==T.WALL) m[y][x]=tile; };
    const sx=Math.sign(x1-x0)||1; for(let x=x0;x!==x1+sx;x+=sx){ set(x,y0); set(x,y0+1); }
    const sy=Math.sign(y1-y0)||1; for(let y=y0;y!==y1+sy;y+=sy){ set(x1,y); set(x1+1,y); }
  }
  // village plaza
  for(let y=32;y<=38;y++)for(let x=28;x<=37;x++) m[y][x]=T.PATH;
  carve(32,16,32,32);           // castle road
  carve(12,37,37,37);           // west road
  carve(37,37,52,37);           // east road + bridge
  carve(52,37,52,8);            // north into hills
  carve(52,8,64,8);             // to shield
  carve(52,37,63,37); carve(63,37,63,39); // to cave
  carve(25,30,25,37); carve(38,30,38,37); carve(25,38,25,43); carve(38,38,38,43);
  carve(12,37,12,20);           // forest path
  carve(12,20,12,11,T.GRASS);   // hidden way
  carve(12,11,6,11,T.GRASS);
  for(let y=9;y<=13;y++)for(let x=3;x<=8;x++) m[y][x] = (x+y)%4===0?T.FLOWER:T.GRASS; // sword clearing
  for(let y=5;y<=10;y++)for(let x=61;x<=67;x++) m[y][x]=T.HILL; // shield clearing
  // houses & fountain
  for(const h of HOUSES) for(let y=h.y;y<h.y+3;y++)for(let x=h.x;x<h.x+4;x++) m[y][x]=T.HOUSE;
  for(let y=0;y<2;y++)for(let x=0;x<2;x++) m[FOUNTAIN.y+y][FOUNTAIN.x+x]=T.FOUNTAIN;
  // cave
  m[CAVE_POS.y][CAVE_POS.x]=T.CAVE; m[CAVE_POS.y][CAVE_POS.x+1]=T.CAVE;
  // borders
  for(let x=0;x<MW;x++){ if(m[0][x]!==T.WATER)m[0][x]=T.TREE; if(m[MH-1][x]!==T.WATER&&m[MH-1][x]!==T.MOUNTAIN)m[MH-1][x]=T.TREE; }
  for(let y=0;y<MH;y++){ m[y][0]=T.TREE; if(m[y][MW-1]!==T.MOUNTAIN) m[y][MW-1]=T.TREE; }
  return {t:m,w:MW,h:MH,name:'world',houses:HOUSES,fountain:FOUNTAIN,castle:CASTLE};
}
function genLair(){
  const w=20,h=15,m=makeGrid(w,h,T.CFLOOR);
  for(let x=0;x<w;x++){m[0][x]=T.CWALL;m[h-1][x]=T.CWALL;}
  for(let y=0;y<h;y++){m[y][0]=T.CWALL;m[y][w-1]=T.CWALL;}
  m[h-1][9]=T.EXIT; m[h-1][10]=T.EXIT;
  return {t:m,w,h,name:'lair'};
}

// ================== TILE ART ==================
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function ell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}
function rrect(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}
function grassBase(g,px,py,r){g.fillStyle=r()<0.5?'#6cc24a':'#67bd45';g.fillRect(px,py,TS,TS);
  if(r()<0.4){g.fillStyle='#58a93b';for(let i=0;i<3;i++){const a=px+2+r()*26,b=py+2+r()*24;g.fillRect(a,b,2,5);g.fillRect(a+3,b+1,2,4);}}}
function drawTile(g,t,px,py,r){
  switch(t){
  case T.GRASS: grassBase(g,px,py,r); break;
  case T.FLOWER: grassBase(g,px,py,r); {const cols=['#ff6b8a','#fff35c','#ffffff','#b48cff','#ff9f43'];
    for(let i=0;i<3;i++){const x=px+5+r()*22,y=py+5+r()*22;g.fillStyle='#3f8f2d';g.fillRect(x-0.5,y,1.5,5);
      circ(g,x,y,3,cols[Math.floor(r()*cols.length)]);circ(g,x,y,1.2,'#ffd23f');}} break;
  case T.TREE: grassBase(g,px,py,r); ell(g,px+16,py+28,11,4,'rgba(0,0,0,.18)');
    g.fillStyle='#7a4a21';g.fillRect(px+13,py+18,6,11);
    circ(g,px+16,py+13,13,r()<0.5?'#2e8b3a':'#2a8035');circ(g,px+10,py+16,7,'#2e8b3a');circ(g,px+22,py+16,7,'#2e8b3a');
    circ(g,px+12,py+9,5,'#43a852');circ(g,px+19,py+7,3,'#5cbf62'); break;
  case T.WATER: g.fillStyle='#3aa0e8';g.fillRect(px,py,TS,TS); g.strokeStyle='#76c4fb';g.lineWidth=2;
    for(let i=0;i<2;i++){const x=px+4+r()*18,y=py+6+r()*20;g.beginPath();g.arc(x,y,4,Math.PI*1.1,Math.PI*1.9);g.stroke();} break;
  case T.BRIDGE: g.fillStyle='#3aa0e8';g.fillRect(px,py,TS,TS);g.fillStyle='#b07a40';g.fillRect(px,py+1,TS,TS-2);
    g.fillStyle='#7a4f24';for(let i=0;i<4;i++)g.fillRect(px+i*8,py+1,1.5,TS-2);
    g.fillStyle='#c9925a';g.fillRect(px,py+1,TS,2); break;
  case T.PATH: g.fillStyle='#e3c98c';g.fillRect(px,py,TS,TS);g.fillStyle='#cdb073';
    for(let i=0;i<4;i++)g.fillRect(px+r()*28,py+r()*28,3,3); break;
  case T.WALL: g.fillStyle='#9aa0a8';g.fillRect(px,py,TS,TS);g.fillStyle='#7c828a';
    for(let row=0;row<4;row++){g.fillRect(px,py+row*8,TS,1.5);const off=row%2?0:8;for(let k=off;k<TS;k+=16)g.fillRect(px+k,py+row*8,1.5,8);}
    g.fillStyle='#b4bac2';g.fillRect(px,py,TS,2); break;
  case T.FLOOR: g.fillStyle=((px/TS+py/TS)%2)?'#e2dccd':'#d4cdbc';g.fillRect(px,py,TS,TS); break;
  case T.CARPET: g.fillStyle='#d4cdbc';g.fillRect(px,py,TS,TS);g.fillStyle='#c8323c';g.fillRect(px,py,TS,TS);
    g.fillStyle='#f2c94c';g.fillRect(px+(px/TS%2?TS-3:0),py,3,TS); break;
  case T.ROCK: { const hill = r()<2; if(hill){g.fillStyle='#8cc65a';g.fillRect(px,py,TS,TS);} ell(g,px+16,py+26,13,5,'rgba(0,0,0,.2)');
    ell(g,px+16,py+18,13,11,'#8f949a');ell(g,px+13,py+14,7,5,'#b3b8be');ell(g,px+21,py+22,4,3,'#767b81'); } break;
  case T.HILL: g.fillStyle=r()<0.5?'#8cc65a':'#88c157';g.fillRect(px,py,TS,TS);
    if(r()<0.35){g.strokeStyle='#76ad48';g.lineWidth=2;g.beginPath();g.arc(px+16,py+30,12,Math.PI*1.15,Math.PI*1.85);g.stroke();} break;
  case T.SAND: g.fillStyle=r()<0.5?'#e3cf93':'#dec98c';g.fillRect(px,py,TS,TS);g.fillStyle='#c9b274';
    for(let i=0;i<3;i++)g.fillRect(px+r()*28,py+r()*28,2,2); break;
  case T.MOUNTAIN: g.fillStyle='#7d6450';g.fillRect(px,py,TS,TS);g.fillStyle='#977a62';

  g.fillStyle='#f0a030';g.fillRect(x-3,y-4,1.5,4);g.fillRect(x+1,y-4,1.5,4);
  ell(g,x,y-8,8,6,'#fff');circ(g,x+5*f,y-14,4.5,'#fff');g.fillStyle='#f0a030';g.beginPath();g.moveTo(x+9*f,y-15);g.lineTo(x+13*f,y-13.5);g.lineTo(x+9*f,y-12);g.fill();
  circ(g,x+5*f,y-19,2,'#e33');circ(g,x+6*f,y-15,1,'#222');ell(g,x-2*f,y-8,4,3,'#eee');
}
function heartPath(g,x,y,s){g.beginPath();g.moveTo(x,y+s*0.3);g.bezierCurveTo(x,y,x-s*0.5,y,x-s*0.5,y+s*0.3);
  g.bezierCurveTo(x-s*0.5,y+s*0.6,x,y+s*0.75,x,y+s);g.bezierCurveTo(x,y+s*0.75,x+s*0.5,y+s*0.6,x+s*0.5,y+s*0.3);
  g.bezierCurveTo(x+s*0.5,y,x,y,x,y+s*0.3);g.closePath();}
function drawHeart(g,x,y,s,frac){
  heartPath(g,x,y,s);g.fillStyle='#3a1a2a';g.fill();
  if(frac>0){g.save();heartPath(g,x,y,s);g.clip();g.fillStyle='#ff3b5c';g.fillRect(x-s/2,y,s*frac,s);
    g.fillStyle='rgba(255,255,255,.5)';g.fillRect(x-s*0.35,y+s*0.15,s*0.15,s*0.15);g.restore();}
  heartPath(g,x,y,s);g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
}
function drawDragon(g,D,t){
  const x=D.x,y=D.y; const resting=D.state==='rest'; const flap=resting?0.2:Math.sin(t*8);
  const flash = D.hurt>0 && Math.floor(t*30)%2===0;
  const body=flash?'#ffffff':'#4caf50', dark=flash?'#eeeeee':'#2e7d32', belly=flash?'#fff':'#d4edb0';
  ell(g,x,resting?y+32:y+60,46,12,'rgba(0,0,0,.25)');
  // tail
  g.strokeStyle=body;g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(x+20,y+18);
  g.quadraticCurveTo(x+60,y+30+Math.sin(t*3)*6,x+58,y-2);g.stroke();g.lineCap='butt';
  g.fillStyle='#ff9f43';g.beginPath();g.moveTo(x+52,y-2);g.lineTo(x+58,y-16);g.lineTo(x+66,y-2);g.fill();
  // wings
  for(const s of [-1,1]){g.fillStyle=dark;g.beginPath();g.moveTo(x+s*14,y-10);g.lineTo(x+s*62,y-34-flap*20);g.lineTo(x+s*56,y+4-flap*6);
    g.lineTo(x+s*40,y-4);g.lineTo(x+s*30,y+8);g.closePath();g.fill();
    g.fillStyle=flash?'#fff':'#81c784';g.beginPath();g.moveTo(x+s*16,y-8);g.lineTo(x+s*56,y-28-flap*18);g.lineTo(x+s*40,y-2);g.closePath();g.fill();}
  // body
  ell(g,x,y+8,32,28,body);ell(g,x,y+14,20,20,belly);
  g.strokeStyle=flash?'#ddd':'#b5d68e';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(x-14,y+6+i*8);g.lineTo(x+14,y+6+i*8);g.stroke();}
  // feet
  ell(g,x-18,y+34,9,6,dark);ell(g,x+18,y+34,9,6,dark);
  // head
  const hy=y-30; circ(g,x,hy,24,body);ell(g,x,hy+10,16,11,belly);
  g.fillStyle='#ffd23f';for(const s of [-1,1]){g.beginPath();g.moveTo(x+s*12,hy-18);g.lineTo(x+s*20,hy-36);g.lineTo(x+s*20,hy-14);g.fill();}
  // spikes
  g.fillStyle='#ff9f43';for(let i=0;i<3;i++){g.beginPath();g.moveTo(x-5,hy-22+i*0);g.lineTo(x,hy-32+i*0-(i===1?4:0));g.lineTo(x+5,hy-22);g.fill();break;}
  // face
  circ(g,x-5,hy+10,1.8,dark);circ(g,x+5,hy+10,1.8,dark);
  if(resting || D.state==='tamed'){
    g.strokeStyle='#222';g.lineWidth=2;for(const s of [-1,1]){g.beginPath();g.arc(x+s*9,hy-4,5,Math.PI*0.15,Math.PI*0.85);g.stroke();}
    if(resting){for(let i=0;i<3;i++){const a=t*3+i*2.09;drawStar(g,x+Math.cos(a)*22,hy-28+Math.sin(a)*6,4,'#ffe14d');}}
    else {for(let i=0;i<3;i++){const a=t*2+i*2.09;drawHeartSmall(g,x+Math.cos(a)*30,hy-30+Math.sin(a*1.3)*8);}}
  } else {
    for(const s of [-1,1]){circ(g,x+s*9,hy-5,7,'#fff');const dx=clamp((P.x-x)/80,-2.5,2.5),dy=clamp((P.y-hy)/80,-2.5,2.5);circ(g,x+s*9+dx,hy-4+dy,3.6,'#222');circ(g,x+s*9+dx-1,hy-5+dy,1.2,'#fff');}
    g.strokeStyle='#222';g.lineWidth=3;for(const s of [-1,1]){g.beginPath();g.moveTo(x+s*3,hy-13);g.lineTo(x+s*15,hy-15+ (D.hp<=5?2:0));g.stroke();}
  }
  g.strokeStyle='#222';g.lineWidth=2;g.beginPath();
  if(D.state==='tamed'){g.arc(x,hy+13,6,0.1,Math.PI-0.1);} else g.arc(x,hy+19,5,Math.PI+0.3,-0.3);
  g.stroke();
}
function drawStar(g,x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}
function drawHeartSmall(g,x,y){heartPath(g,x,y-5,10);g.fillStyle='#ff5c8a';g.fill();}

// ================== HELPERS ==================
function tileAt(m,px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=m.w||ty>=m.h)return T.TREE;return m.t[ty][tx];}
function solidAt(m,px,py){return SOLID.has(tileAt(m,px,py));}
function boxHits(m,x,y,hw,hh){return solidAt(m,x-hw,y-hh)||solidAt(m,x+hw,y-hh)||solidAt(m,x-hw,y+hh)||solidAt(m,x+hw,y+hh);}
function npcBlock(x,y){ if(map!==WORLD) return false; for(const n of npcs){ if(Math.abs(n.x-x)<16&&Math.abs(n.y-y)<12) return true; } return false; }
function moveEnt(e,dx,dy,hw,hh,isPlayer){
  const steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/8)||1;
  for(let i=0;i<steps;i++){
    const sx=dx/steps, sy=dy/steps;
    if(!boxHits(map,e.x+sx,e.y,hw,hh) && !(isPlayer&&npcBlock(e.x+sx,e.y))) e.x+=sx;
    if(!boxHits(map,e.x,e.y+sy,hw,hh) && !(isPlayer&&npcBlock(e.x,e.y+sy))) e.y+=sy;
  }
}
function addParticles(x,y,n,cols,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(spd||80)*(0.4+Math.random());
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.5+Math.random()*0.5,col:cols[i%cols.length],size:2+Math.random()*3});}}
function addText(x,y,txt,col){texts.push({x,y,txt,col:col||'#fff',life:1.3});}
function startDialog(lines,onEnd){G.dialog={lines,i:0,chars:0,onEnd};G.mode='dialog';}
function hurtPlayer(amount,fromX,fromY){
  if(P.inv>0||G.mode!=='play') return;
  G.hp=Math.max(0,G.hp-amount);P.inv=1.1;SFX.hurt();G.shake=0.25;
  const dx=P.x-fromX,dy=P.y-fromY,d=Math.hypot(dx,dy)||1;P.kbx=dx/d*260;P.kby=dy/d*260;P.kbT=0.18;

function updateDragon(dt){
  if(!D) return;
  D.t+=dt; D.stateT+=dt; if(D.hurt>0) D.hurt-=dt;
  const angry = D.hp<=6;
  if(D.state==='fly'){
    D.x = 320 + Math.sin(D.t*(angry?0.95:0.7))*200; D.y = D.baseY + Math.sin(D.t*1.7)*14;
    D.shootT-=dt;
    if(D.shootT<=0){
      D.shootT = angry?1.3:1.8; D.shots++;
      const ang=Math.atan2(P.y-14-(D.y-20),P.x-D.x);
      const spread = angry?[-0.25,0,0.25]:[0];
      for(const s of spread) fireballs.push({x:D.x,y:D.y-14,vx:Math.cos(ang+s)*120,vy:Math.sin(ang+s)*120,life:5});
      beep(300,0.15,'sawtooth',0.04,150);
      if(D.shots>=(angry?4:3)){D.state='land';D.stateT=0;D.shots=0;D.fromY=D.y;}
    }
    // contact
    if(Math.abs(P.x-D.x)<38 && P.y>D.y-50 && P.y<D.y+46) hurtPlayer(G.hasShield?1:2,D.x,D.y);
  } else if(D.state==='land'){
    const p=Math.min(1,D.stateT/0.7); D.y = D.fromY + (250-D.fromY)*p;
    if(p>=1){D.state='rest';D.stateT=0;G.shake=0.2;beep(90,0.3,'square',0.06);}
  } else if(D.state==='rest'){
    if(D.stateT>3.2){D.state='rise';D.stateT=0;}
  } else if(D.state==='rise'){
    const p=Math.min(1,D.stateT/0.8); D.y = 250 + (D.baseY-250)*p;
    if(p>=1){D.state='fly';D.stateT=0;D.shootT=1.2;}
  } else if(D.state==='tamed'){
    D.y += Math.sin(D.t*4)*0.3;
    if(Math.random()<0.3) particles.push({x:D.x+(Math.random()-0.5)*80,y:D.y-40,vx:0,vy:-40,life:1,col:['#ff5c8a','#ffe14d','#7ef0ff'][Math.floor(Math.random()*3)],size:3});
    if(D.stateT>2.4 && !D.saidBye){D.saidBye=true;
      startDialog([{who:'Grumblefire the Dragon',text:"Okay, okay! You win, George! You're too brave for me!"},
        {who:'Grumblefire the Dragon',text:"I promise to stop roaring at night and never scare the sheep again. Can we be friends?"},
        {who:'George',text:"Of course! Silene is safe, and now we have a dragon friend!"}],()=>{G.mode='victory';G.vt=0;SFX.win();makeConfetti();});}
  }
  // fireballs
  for(const f of fireballs){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;
    if(solidAt(map,f.x,f.y)) f.life=0;

let confetti=[];

  r:Math.random()*6,s:3+Math.random()*4,col:['#ff3b5c','#ffe14d','#4fc3f7','#7cfc8a','#ff9f43','#b48cff'][i%6]});}
function update(dt){
  if(pv.mute){muted=!muted;}
  if(G.mode==='title'){ titleT+=dt; if(pv.action) {newGame();SFX.pickup();} pv={}; return; }
  G.t+=dt;
  if(G.shake>0)G.shake-=dt;
  switch(G.mode){
  case 'dialog': updateDialog(dt); break;
  case 'log': if(pv.log||pv.action) G.mode='play'; if(pv.restart) toTitle(); break;
  case 'play': updatePlay(dt); break;
  case 'join': G.joinT+=dt; if(G.joinT>1.6 && !G.joinSfx){G.joinSfx=true;SFX.win();G.shake=0.3;}
    if(G.joinT>=3.0){ G.hasSpear=true; G.mode='play';
      startDialog([{who:'George',text:"The two pieces joined together! I have the HOLY SPEAR!"},
        {who:'Tip',text:"Press SPACE (or A) to poke with the spear. It reaches farther than the sword! Now go to the dragon's cave in the south-east."}]); } break;
  case 'faint': G.faintT-=dt; if(G.faintT<=0) respawn(); break;
  case 'fade': { const f=G.fade; f.t+=dt; if(!f.done && f.t>=f.dur/2){f.done=true;f.mid();updateCamera(true);} if(f.t>=f.dur){G.mode='play';G.fade=null; if(f.after) f.after();} } break;
  case 'victory': G.vt+=dt; for(const c of confetti){c.y+=c.vy*dt;c.x+=c.vx*dt;c.r+=dt*4;if(c.y>H+10){c.y=-10;c.x=Math.random()*W;}}
    if((pv.action||pv.restart)&&G.vt>1.5) toTitle(); break;
  }
  if(G.mode!=='victory'&&G.mode!=='title'){
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;}
    particles=particles.filter(p=>p.life>0);
    for(const t of texts){t.y-=30*dt;t.life-=dt;} texts=texts.filter(t=>t.life>0);
    if(G.mode==='play'||G.mode==='dialog') updateDragonAnimOnly(dt);
  }
  pv={};
}
function updateDragonAnimOnly(dt){ if(D && G.mode==='dialog' && D.state==='tamed'){D.t+=dt;} }
function updateDialog(dt){
  const d=G.dialog, line=d.lines[d.i];
  const before=Math.floor(d.chars); d.chars=Math.min(line.text.length,d.chars+dt*55);
  if(Math.floor(d.chars)!==before && Math.floor(d.chars)%3===0) SFX.talk();
  if(pv.action){
    if(d.chars<line.text.length) d.chars=line.text.length;
    else { d.i++; d.chars=0; if(d.i>=d.lines.length){ G.dialog=null; G.mode='play'; if(d.onEnd) d.onEnd(); } }
  }
}

  map=WORLD; P.x=START.x; P.y=START.y; P.dir='up'; P.inv=1.5; P.kbT=0; G.hp=G.maxHp; D=null; fireballs=[];

function updatePlay(dt){
  G.playTime+=dt;
  if(pv.log){G.mode='log';return;}
  const inp=inputDir(); let dx=inp.x, dy=inp.y; const mag=Math.hypot(dx,dy);
  if(mag>0){dx/=mag;dy/=mag;
    if(Math.abs(inp.x)>0 && Math.abs(inp.y)>0){ if(!((P.dir==='left'&&inp.x<0)||(P.dir==='right'&&inp.x>0)||(P.dir==='up'&&inp.y<0)||(P.dir==='down'&&inp.y>0))) P.dir = inp.x<0?'left':'right'; }
    else P.dir = inp.x<0?'left':inp.x>0?'right':inp.y<0?'up':'down';
    P.walk+=dt*14;
  } else P.walk=0;
  const sp = P.attackT>0 ? SPEED*0.55 : SPEED;
  moveEnt(P,dx*sp*dt,dy*sp*dt,8,6,true);
  if(P.kbT>0){P.kbT-=dt;moveEnt(P,P.kbx*dt,P.kby*dt,8,6,true);}
  if(P.inv>0)P.inv-=dt; if(P.attackT>0)P.attackT-=dt; if(G.noSwordT>0)G.noSwordT-=dt;
  // action
  if(pv.action){
    let near=null,best=46;
    if(map===WORLD) for(const n of npcs){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<best){best=d;near=n;}}
    if(near){
      near.dir = Math.abs(P.x-near.x)>Math.abs(P.y-near.y) ? (P.x<near.x?'left':'right') : (P.y<near.y?'up':'down');
      startDialog(npcLines(near),()=>onTalkEnd(near)); SFX.talk(); return;
    } else if(G.hasSword){ if(P.attackT<=0){P.attackT=ATTACK_TIME;P.hitSet=new Set();SFX.swing();} }
    else if(G.noSwordT<=0){ addText(P.x,P.y-50,'Find a sword first!','#fff'); G.noSwordT=1.2; }
  }
  // attack hits
  if(P.attackT>0){
    const ab=attackBox();
    for(const s of foes){ if(s.flee||P.hitSet.has(s)) continue;
      if(Math.hypot(s.x-ab.x,(s.y-10)-ab.y)<ab.r+(s.kind==='bear'?18:12)){ P.hitSet.add(s); s.hp--; s.hurt=0.25;
        const d=Math.hypot(s.x-P.x,s.y-P.y)||1; s.kbx=(s.x-P.x)/d*300*s.kbMul; s.kby=(s.y-P.y)/d*300*s.kbMul; SFX.hit();
        addParticles(s.x,s.y-12,5,['#fff','#ffe14d'],80);
        if(s.hp<=0){ s.flee=true; s.fleeT=0.9; G.chased++; SFX.poof(); s.face=(s.x>=P.x)?1:-1;
          s.vx=(s.x-P.x)/d*230; s.vy=(s.y-P.y)/d*230; s.kbx=0; s.kby=0;
          addParticles(s.x,s.y-10,12,['#e8dcc0','#fff','#ffe14d'],110);
          addText(s.x,s.y-36,s.kind==='bear'?'The bear runs home!':'Yelp! Ran away!','#ffe14d');
          const chance = G.hp<G.maxHp?0.55:0.15; if(Math.random()<chance) items.push({type:'heart',x:s.x,y:s.y,map:map.name}); } } }
    if(D){ const inX=Math.abs(ab.x-D.x)<ab.r+40, inY=ab.y>D.y-75-ab.r && ab.y<D.y+40+ab.r; if(inX&&inY&&!P.hitSet.has('D')){P.hitSet.add('D');hitDragon();} }
    for(const f of fireballs){ if(Math.hypot(f.x-ab.x,f.y-ab.y)<ab.r+8){ f.life=0; addParticles(f.x,f.y,8,['#ffb347','#ffe14d','#fff']); SFX.clang(); addText(f.x,f.y-14,'Pop!','#ffb347'); } }
  }
  foes=foes.filter(s=>!s.gone);
  // wolves & bears
  if(map===WORLD) for(const s of foes){
    if(s.hurt>0)s.hurt-=dt;
    if(s.flee){ s.fleeT-=dt; s.anim+=dt*22; s.x+=s.vx*dt; s.y+=s.vy*dt;
      if(s.fleeT<=0){ s.gone=true; addParticles(s.x,s.y-10,10,['#e8dcc0','#fff'],70); } continue; }
    s.t-=dt;
    const dP=Math.hypot(P.x-s.x,P.y-s.y), dH=Math.hypot(s.hx-s.x,s.hy-s.y);
    if(s.t<=0){ s.t=s.kind==='wolf'?0.5+Math.random()*0.8:1+Math.random()*1.2;
      if(dP<s.sight && dH<220){const a=Math.atan2(P.y-s.y,P.x-s.x);s.vx=Math.cos(a)*s.chase;s.vy=Math.sin(a)*s.chase;}
      else if(dH>100){const a=Math.atan2(s.hy-s.y,s.hx-s.x);s.vx=Math.cos(a)*s.wander*1.3;s.vy=Math.sin(a)*s.wander*1.3;}
      else if(Math.random()<0.6){const a=Math.random()*Math.PI*2;s.vx=Math.cos(a)*s.wander;s.vy=Math.sin(a)*s.wander;} else {s.vx=0;s.vy=0;} }
    moveEnt(s,s.vx*dt+s.kbx*dt,s.vy*dt+s.kby*dt,s.hw,6,false);
    if(Math.abs(s.vx)>3) s.face=s.vx>0?1:-1;
    s.anim += (Math.abs(s.vx)+Math.abs(s.vy)>2 ? dt*(s.kind==='wolf'?16:9) : 0);
    s.kbx*=Math.pow(0.02,dt); s.kby*=Math.pow(0.02,dt);
    const reach = s.kind==='bear'?26:20;
    if(dP<reach && P.inv<=0){ hurtPlayer(s.dmg,s.x,s.y); const d=dP||1; s.kbx=(s.x-P.x)/d*220; s.kby=(s.y-P.y)/d*220; s.t=s.kind==='bear'?1.4:1.0; s.vx=0; s.vy=0;
      if(s.kind==='bear') beep(110,0.25,'sawtooth',0.05,70); }
  }
  // chickens
  if(map===WORLD) for(const c of chickens){ c.t-=dt; if(c.t<=0){c.t=0.6+Math.random()*1.5;const a=Math.random()*Math.PI*2,s=Math.random()<0.3?0:22;c.vx=Math.cos(a)*s;c.vy=Math.sin(a)*s;}
    const dP=Math.hypot(P.x-c.x,P.y-c.y); if(dP<40){const a=Math.atan2(c.y-P.y,c.x-P.x);c.vx=Math.cos(a)*70;c.vy=Math.sin(a)*70;c.t=0.4; if(Math.random()<0.02)beep(1400,0.05,'square',0.02,1800);}
    moveEnt(c,c.vx*dt,c.vy*dt,6,4,false);
    c.x=clamp(c.x,VILLAGE.x0*TS,VILLAGE.x1*TS); c.y=clamp(c.y,VILLAGE.y0*TS,VILLAGE.y1*TS); }
  // items

    if(Math.hypot(it.x-P.x,it.y-(P.y-8))<22){
      if(it.type==='heart'){ if(G.hp>=G.maxHp) continue; it.got=true; G.hp=Math.min(G.maxHp,G.hp+2); SFX.pickup(); addText(it.x,it.y-20,'+1 heart','#ff7b95'); addParticles(it.x,it.y-8,8,['#ff3b5c','#fff']); }
      else if(it.type==='spearHead'||it.type==='spearShaft'){ it.got=true; const head=it.type==='spearHead';
        G.pieces[head?'head':'shaft']=true; SFX.item(); addParticles(it.x,it.y-10,24,['#fff','#ffe14d','#7ef0ff'],140);
        const both=G.pieces.head&&G.pieces.shaft;
        startDialog([{who:'George',text: head?"You found the SPEAR HEAD! The shiny tip of the Holy Spear!":"You found the SPEAR SHAFT! The golden handle of the Holy Spear!"},
          both?{who:'George',text:"Both pieces are glowing... something magical is happening!"}
              :{who:'Tip',text: head?"Now find the Spear Shaft on top of the Eastern Hills. A bear guards it!":"Now find the Spear Head deep in the West Forest. Watch out for wolves!"}],
          both?()=>{G.mode='join';G.joinT=0;SFX.item();}:null); }
    } }
  items=items.filter(i=>!i.got);
  // tile triggers
  const here=tileAt(map,P.x,P.y-4);
  if(here===T.CAVE){
    if(bothItems()){ enterLair(); }
    else { P.y+=14; startDialog([{who:'George',text: !G.talkedKing?"A dark, scary cave... I should talk to the King first.":"Sir Pip says I need the complete Holy Spear to face the dragon!"}]); }
  }

  if(map===LAIR) updateDragon(dt);
  updateCamera(false);
}

function wrapText(g,text,maxW){const words=text.split(' ');const lines=[];let cur='';

function renderHUD(){
  // hearts
  rrect(ctx,6,6,5*26+12,34,8,'rgba(0,0,0,.45)');
  for(let i=0;i<G.maxHp/2;i++){const units=clamp(G.hp-i*2,0,2);drawHeart(ctx,24+i*26,12,22,units/2);}
  // items
  const ix=W-176; rrect(ctx,ix,6,170,34,8,'rgba(0,0,0,.45)');
  drawSwordIcon(ctx,ix+18,30,0.8,0.6); drawShieldIcon(ctx,ix+44,23,0.95);
  if(G.hasSpear){ drawSpear(ctx,ix+80,23,0.42,1.0,'full'); }
  else { ctx.globalAlpha=G.pieces.head?1:0.25; drawSpear(ctx,ix+80,30,0.42,1.0,'head'); ctx.globalAlpha=G.pieces.shaft?1:0.25; drawSpear(ctx,ix+76,25,0.42,1.0,'shaft'); ctx.globalAlpha=1; }
  ctx.font='bold 11px Verdana';ctx.textAlign='left';outlined(ctx,padSeen?'B: Quests':'Q: Quests',ix+104,27,'#fff','#000',3);
  // objective
  if(map===WORLD && G.mode!=='victory'){
    const ob=objective(); ctx.font='bold 13px Verdana'; const w=ctx.measureText(ob.text).width+40;
    rrect(ctx,(W-w)/2,H-30,w,24,8,'rgba(0,0,0,.5)'); drawStar(ctx,(W-w)/2+16,H-18,7,'#ffe14d');
    ctx.textAlign='left'; outlined(ctx,ob.text,(W-w)/2+28,H-13,'#fff','#000',3);
    // minimap
    const s=1.5, mw=map.w*s, mh=map.h*s, mx=W-mw-8, my=46;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(mx-3,my-3,mw+6,mh+6);ctx.imageSmoothingEnabled=false;
    ctx.drawImage(map.mini,mx,my,mw,mh);
    const blink=Math.sin(G.t*6)>0;
    drawStar(ctx,mx+(ob.tx+0.5)*s,my+(ob.ty+0.5)*s,blink?6:5,'#ffe14d');
    if(ob.tx2!==undefined) drawStar(ctx,mx+(ob.tx2+0.5)*s,my+(ob.ty2+0.5)*s,blink?6:5,'#ffe14d');
    circ(ctx,mx+P.x/TS*s,my+P.y/TS*s,3,'#fff');circ(ctx,mx+P.x/TS*s,my+P.y/TS*s,2,'#d62828');
  }
  if(map===LAIR && D){
    const bw=300,bx=(W-bw)/2,by=14; rrect(ctx,bx-6,by-6,bw+12,36,8,'rgba(0,0,0,.6)');
    ctx.font='bold 11px Verdana';ctx.textAlign='center';outlined(ctx,'GRUMBLEFIRE THE DRAGON',W/2,by+6,'#ffe14d','#000',3);
    ctx.fillStyle='#3a1a2a';ctx.fillRect(bx,by+11,bw,12);ctx.fillStyle=D.hp<=4?'#ff7043':'#7cfc8a';ctx.fillRect(bx,by+11,bw*Math.max(0,D.hp)/D.maxHp,12);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx,by+11,bw,12);
    if(D.state==='rest'){ctx.font='bold 16px Verdana';outlined(ctx,'The dragon is tired! Hit it now!',W/2,H-16,'#ffe14d','#000',4);}
  }
}
function renderDialog(){
  const d=G.dialog; if(!d) return; const line=d.lines[d.i];
  const bx=20,by=H-140,bw=W-40,bh=118;
  rrect(ctx,bx,by,bw,bh,12,'rgba(20,16,48,.92)'); ctx.strokeStyle='#ffe14d';ctx.lineWidth=3;ctx.strokeRect(bx+4,by+4,bw-8,bh-8);
  ctx.font='bold 15px Verdana';ctx.textAlign='left';
  const nw=ctx.measureText(line.who).width+20; rrect(ctx,bx+16,by-14,nw,26,8,'#d62828'); ctx.fillStyle='#fff';ctx.fillText(line.who,bx+26,by+4);
  ctx.font='17px Verdana';ctx.fillStyle='#fff';
  const lines=wrapText(ctx,line.text.slice(0,Math.floor(d.chars)),bw-44);
  lines.forEach((l,i)=>ctx.fillText(l,bx+22,by+38+i*24));
  if(d.chars>=line.text.length && Math.sin(G.t*6)>0){ctx.font='bold 13px Verdana';ctx.textAlign='right';ctx.fillStyle='#ffe14d';ctx.fillText((padSeen?'A':isTouch?'Tap A':'SPACE')+' \u25B6',bx+bw-16,by+bh-12);}
}
function renderLog(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);

    ["Join them into the Holy Spear",G.hasSpear,"Happens by magic when you have both pieces"],
    ["Make the dragon leave Silene alone",G.dragonDefeated,"In the cave to the south-east"]];
  ctx.textAlign='left';
  qs.forEach((q,i)=>{const y=by+84+i*54; rrect(ctx,bx+34,y-18,24,24,5,q[1]?'#4caf50':'#fff'); ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.strokeRect(bx+34,y-18,24,24);

  ctx.fillText(padSeen?'B / Start / A: close   \u2022   Back (Share): restart game':(isTouch?'Tap to close':'Q / SPACE: close')+'   \u2022   R: restart game   \u2022   M: sound on/off',W/2,by+bh-22);
}
function renderTitle(){
  const t=titleT;
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5ec8ff');gr.addColorStop(0.6,'#bfeaff');gr.addColorStop(0.61,'#6cc24a');gr.addColorStop(1,'#4ea83a');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  circ(ctx,560,70,34,'#fff3a0');
  for(let i=0;i<3;i++){const x=((t*15+i*230)%(W+160))-80,y=60+i*30;ell(ctx,x,y,40,14,'#fff');ell(ctx,x+25,y-8,24,14,'#fff');}
  ell(ctx,120,300,220,50,'#5aa83c'); ell(ctx,520,300,200,40,'#5aa83c');
  // castle silhouette
  ctx.fillStyle='#9aa0a8';ctx.fillRect(60,200,120,95);ctx.fillRect(50,170,30,125);ctx.fillRect(160,170,30,125);
  for(let i=0;i<4;i++)ctx.fillRect(60+i*32,190,16,12);ctx.fillStyle='#6a4a2a';ctx.beginPath();ctx.arc(120,295,18,Math.PI,0);ctx.fill();
  ctx.fillStyle='#d62828';ctx.beginPath();ctx.moveTo(65,170);ctx.lineTo(65,140);ctx.lineTo(85,148);ctx.lineTo(65,156);ctx.fill();
  // dragon flying

  const saveP=P; P={x:300,y:380}; drawDragon(ctx,fakeD,t); P=saveP;

  ctx.save();ctx.translate(250,400);ctx.scale(2.2,2.2);

  drawShieldIcon(ctx,10,-14,0.72);drawSwordIcon(ctx,-12,-14,0.7,-0.9+Math.sin(t*3)*0.2);ctx.restore();
  // title text
  ctx.textAlign='center';ctx.font='bold 44px Georgia, serif';
  outlined(ctx,'Saint George',W/2,78,'#ffe14d','#5a1a1a',8);
  ctx.font='bold 30px Georgia, serif';outlined(ctx,'& the Dragon',W/2,116,'#fff','#5a1a1a',7);
  ctx.font='bold 15px Verdana';outlined(ctx,'A quest to save the town of Silene',W/2,142,'#fff','#1a3a5a',4);
  if(Math.sin(t*4)>-0.3){ctx.font='bold 22px Verdana';outlined(ctx,padSeen?'Press A or START!':isTouch?'Tap to start!':'Press SPACE to start!',W/2,H-58,'#fff','#d62828',6);}
  ctx.font='12px Verdana';outlined(ctx,'Move: Arrows / WASD / Stick    Talk & Attack: SPACE, E or (A)    Quests: Q or (B)',W/2,H-24,'#fff','#000',3);
}
function renderVictory(){
  const a=clamp(G.vt/1,0,1);ctx.fillStyle='rgba(20,30,80,'+(0.75*a)+')';ctx.fillRect(0,0,W,H);
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.col;ctx.fillRect(-c.s/2,-c.s,c.s,c.s*2);ctx.restore();}
  ctx.textAlign='center';const b=Math.sin(G.vt*3)*4;
  ctx.font='bold 54px Georgia, serif';outlined(ctx,'HOORAY!',W/2,110+b,'#ffe14d','#5a1a1a',9);
  ctx.font='bold 24px Verdana';outlined(ctx,'Saint George saved Silene!',W/2,152,'#fff','#000',5);
  // friendly dragon + george
  const fakeD={x:420,y:280,state:'tamed',hp:0,hurt:0,t:G.vt};drawDragon(ctx,fakeD,G.vt);
  ctx.save();ctx.translate(230,330);ctx.scale(2,2);drawPerson(ctx,0,0,{shirt:'#ffffff',cross:true,helmet:true,hair:'#8a5a2b',legs:'#5b6b88'},'down',0);
  drawSpear(ctx,13,-22-Math.abs(Math.sin(G.vt*4))*4,0.6,0.15);drawShieldIcon(ctx,-11,-14,0.72);ctx.restore();
  ctx.font='16px Verdana';outlined(ctx,'The dragon promised to be friendly, and the sheep can sleep again!',W/2,385,'#fff','#000',4);
  const m=Math.floor(G.playTime/60), s=Math.floor(G.playTime%60);

  if(G.vt>1.5 && Math.sin(G.vt*4)>-0.3){ctx.font='bold 20px Verdana';outlined(ctx,padSeen?'Press A or START to play again':isTouch?'Tap to play again':'Press SPACE or R to play again',W/2,454,'#fff','#d62828',6);}
}

// ================== MAIN LOOP ==================
buildMaps();
P={x:0,y:0,dir:'down'};
toTitle();
let last=performance.now(), frames=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; frames++;
  try { pollGamepad(); if(toast.t>0) toast.t-=dt; update(dt); render(); } catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// expose for testing/debug
window.__sg = {get G(){return G;},get P(){return P;},get D(){return D;},get frames(){return frames;},get map(){return map;},get foes(){return foes;},get items(){return items;},
  WORLD:()=>WORLD, LAIR:()=>LAIR, enterLair, hitDragon, update, render};
